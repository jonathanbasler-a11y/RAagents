            <h3>Public sources <span class="tag">Agents always</span></h3>
            <p>${K.public.map(esc).join(' · ')}</p>
          </div>
          <div class="tier">
            <h3>Licensor data room <span class="tag">DD team</span></h3>
            <p>You decide, document by document, what the agents may read. Not decided means no.</p>
            <ul class="docs">${vdrRows}</ul>
          </div>
          <div class="tier">
            <h3>Ring-fenced DD repository <span class="tag">DD team</span></h3>
            <p>Licensor answers land here. Same rule: agents read only what you release.</p>
            <ul class="docs">${rspRows}</ul>
          </div>
        </div>
      </section>
    </div>
  </div>
  <div class="request-foot">
    <p class="note" style="margin:0">Activating starts the plan step. You can change the questions later.</p>
    <button type="button" class="btn btn-primary" data-action="activate">Activate team</button>
  </div>`;
};

/* Mode: planned or reactive. Updates the header, the note and the deadline in place. */
CHANGES.mode = el => {
  const v = el.value;
  if (!DATA.dd.modeNote[v] || v === state.mode) return;
  state.mode = v;
  renderHeader();
  const note = $('#modeNote'), deadline = $('#f-deadline');
  if (note) note.textContent = DATA.dd.modeNote[v];
  if (deadline) deadline.value = DATA.dd.deadline[v];
  toast(v === 'reactive' ? 'Switched to reactive DD' : 'Switched to planned DD');
  addLog(LEAD, 'person', `switched to a ${v} DD.`);
};

/* Stage: at Phase 3 or Filed a filing is near, so the late agents join; before that they leave. */
CHANGES.stage = el => {
  const v = el.value;
  if (v === state.stage) return;
  const wasLate = isLate();
  state.stage = v;
  const late = isLate();
  let team = '';
  if (late !== wasLate) {
    const moved = DATA.request.lateAgents.filter(id => state.selected.has(id) !== late);
    moved.forEach(id => { if (late) state.selected.add(id); else state.selected.delete(id); });
    renderHeader();
    if (moved.length) team = `${requestAgents(moved)} ${late ? 'added to' : 'removed from'} the team`;
  }
  toast(team ? `${v}: ${team}` : `Development stage set to ${v}`);
  addLog(LEAD, 'person', `set the development stage to ${v}.` + (team ? (late ? ' A filing is near: ' : ' ') + team + '.' : ''));
  const host = $('#lateHost');
  if (host) host.innerHTML = requestLateHTML();
};

/* Classification: each one brings in (or drops) its specialist agent. */
ACTIONS.cls = el => {
  const c = DATA.request.classes.find(x => x.id === el.dataset.id);
  if (!c) return;
  const on = !state.cls.has(c.id);
  if (on) { state.cls.add(c.id); state.selected.add(c.agent); }
  else { state.cls.delete(c.id); state.selected.delete(c.agent); }
  el.setAttribute('aria-pressed', String(on));
  renderHeader();
  const who = requestAgents([c.agent]);
  toast(`${who} ${on ? 'added to' : 'removed from'} the team`);
  addLog(LEAD, 'person', on
    ? `added the classification ${c.label}: ${who} selected.`
    : `removed the classification ${c.label}: ${who} not selected.`);
};

/* Regions, as v1. */
ACTIONS.region = el => {
  const r = el.dataset.region;
  const on = !state.regions.has(r);
  if (on) state.regions.add(r); else state.regions.delete(r);
  el.setAttribute('aria-pressed', String(on));
  addLog(LEAD, 'person', on ? `added the region ${r}.` : `removed the region ${r}.`);
};

/* Release: who may read a data room document or licensor answer. The same document can
   show a select in several places (this screen, the licensor requests), so every copy is
   updated in place. No re-render: it would wipe typed inputs. */
CHANGES.release = el => {
  const id = el.dataset.id, v = el.value;
  const doc = docById(id);
  if (!doc || doc.locked || !DATA.knowledge.releaseLabels[v] || state.release[id] === v) return;
  state.release[id] = v;
  $$('select[data-action="release"]').forEach(s => {
    if (s.dataset.id !== id) return;
    s.value = v;
    s.className = 'rel r-' + v;
  });
  const count = $('#relCount');
  if (count) count.textContent = requestRelText();
  const name = `${doc.name} (${doc.id})`;
  if (v === 'yes') {
    toast('Released to the agents: ' + doc.name);
    addLog(LEAD, 'person', `released ${name} to the agents.`);
  } else if (v === 'no') {
    toast('DD team only: ' + doc.name);
    addLog(LEAD, 'person', `kept ${name} to the DD team only.`);
  } else {
    toast(`Not decided yet: ${doc.name} (agents cannot read it)`);
    addLog(LEAD, 'person', `marked ${name} as not decided yet. The agents cannot read it.`);
  }
};

/* Activate: hand over to the regulatory team. */
ACTIONS.activate = () => {
  const n = selectedCount();
  addLog(LEAD, 'person', `activated the team with ${n} agents and released ${releasedCount()} of ${vdrTotal()} data room documents to the agents.`);
  toast(`Team activated: ${n} agent${n === 1 ? '' : 's'}`);
  go('team', 'title');
};

/* ======================= frag-team.js ======================= */
/* ================= Screen 2: Regulatory team =================
   The whole regulatory function as agents, grouped by DATA.agentGroups.
   A person switches agents on or off; team roles are always on. */

/* Ids of "Specification" panels that were open when a switch was used, so the
   re-render that follows keeps them open. Read once by SCREENS.team, then reset. */
let teamOpenSpecs = new Set();

function teamPeopleHTML() {
  return DATA.people.map(p =>
    `<div class="person"><span class="caps">${esc(p.kind)}</span><b>${esc(p.role)}</b><p>${esc(p.text)}</p></div>`).join('');
}

/* The playbook's autonomy ceiling as a level number (L2 for this DD). */
function teamCeiling() {
  const l = DATA.levels.find(x => x.label === DATA.dd.ceiling);
  return l ? l.n : 2;
}

function teamLadderHTML(ceil) {
  return DATA.levels.map(l =>
    `<span class="rung${l.n > ceil ? ' above' : ''}">${meter(l.n)}${esc(l.label)}${l.n > ceil ? ' · above ceiling' : ''}</span>` +
    (l.n === ceil ? `<span class="ceiling">Ceiling for this playbook</span>` : '')).join('');
}

/* Regions the regional experts cover: the ones selected on the Request screen, in DATA order. */
function teamRegionsHTML() {
  const rs = DATA.request.regions.filter(r => state.regions.has(r));
  return rs.length
    ? `<ul class="chips" aria-label="Regions in this DD">${rs.map(r => `<li class="tag">${esc(r)}</li>`).join('')}</ul>`
    : `<p><span class="tag proposal">No region selected</span></p>`;
}

/* What switches a triggered agent on: a classification of the asset, or a near filing. */
function teamTrigHTML(a) {
  if (!a.trigger) return '';
  if (a.trigger === 'late') return `<p class="trig">Joins when a filing is near (Phase 3 or filed)</p>`;
  const c = DATA.request.classes.find(x => x.id === a.trigger);
  return c ? `<p class="trig">Switched on by: ${esc(c.label)}</p>` : '';
}

/* Status lines are DATA text, with two exceptions.
   DATA gives the "Other functions" agents the status "Not selected". Once a person
   selects one, that line would contradict the switch: the agent has simply not started.
   The Sanitiser waits on the lead only while a sanitised question awaits approval; the
   lead approves it on the run board or in the finding, so that line follows the state. */
function teamStatus(a) {
  if (a.id === 'san') {
    const ids = DATA.findings.filter(f => expertOf(f).state === 'drafted').map(f => f.id);
    if (!ids.length) return { text: 'No sanitised question is waiting for your approval', wait: false };
    return { text: ids.length === 1
      ? `A sanitised question on ${ids[0]} is waiting for your approval`
      : `Sanitised questions on ${ids.join(', ')} are waiting for your approval`, wait: true };
  }
  return { text: a.status === 'Not selected' ? 'Not started' : a.status, wait: !!a.wait };
}

function teamSwitchHTML(a, on) {
  const id = esc(a.id), name = esc(a.name);
  if (a.locked) {
    return `<button type="button" class="switch" role="switch" id="sw-${id}" aria-checked="true" disabled aria-label="${name}: include in this DD (always on)"><span class="track" aria-hidden="true"></span>Always on</button>`;
  }
  return `<button type="button" class="switch" role="switch" id="sw-${id}" aria-checked="${on}" data-action="toggle-agent" data-id="${id}" aria-label="${name}: include in this DD"><span class="track" aria-hidden="true"></span>${on ? 'Selected' : 'Not selected'}</button>`;
}

function teamAgentHTML(a, g) {
  const on = state.selected.has(a.id);
  const id = esc(a.id);
  const st = teamStatus(a);
  const status = on
    ? `<p class="agent-status ${st.wait ? 'wait' : 'pencil'}">${st.wait ? ICON.dot : ICON.pencil}<span>${linkify(st.text)}</span></p>`
    : '';
  return `<article class="agent${on ? '' : ' off'}" role="listitem" aria-labelledby="ag-${id}">
      <div class="agent-top"><div class="left"><span class="tag">${esc(g.tag)}</span>${levelBadge(a.level)}</div>${teamSwitchHTML(a, on)}</div>
      <h3 id="ag-${id}">${esc(a.name)}</h3>
      <p class="desc">${esc(a.desc)}</p>
      ${a.id === 'regional' ? teamRegionsHTML() : ''}
      ${teamTrigHTML(a)}
      <details class="spec" data-id="${id}"${teamOpenSpecs.has(a.id) ? ' open' : ''}>
        <summary>Specification<span class="visually-hidden"> for ${esc(a.name)}</span></summary>
        <dl class="kv">
          <dt>Human owner</dt><dd>${esc(a.owner)}</dd>
          <dt>Knowledge sources</dt><dd><ul class="srcs">${a.sources.map(s => `<li>${esc(s)}</li>`).join('')}</ul></dd>
          <dt>Guardrail</dt><dd class="guard">${esc(a.guard)}</dd>
        </dl>
      </details>
      ${status}
    </article>`;
}

/* One block per agent group. The collapsed group ("Other functions") is a <details>
   whose open state the core keeps in state.otherOpen; css-team.css swaps Show / Hide. */
function teamGroupHTML(g) {
  const list = DATA.agents.filter(a => a.group === g.id);
  const n = list.filter(a => state.selected.has(a.id)).length;
  const hid = 'grp-h-' + esc(g.id);
  const h2 = `<h2 class="panel-h" id="${hid}">${esc(g.label)} <small>${n} of ${list.length} selected</small></h2>`;
  const cards = `<div class="agents" role="list" aria-labelledby="${hid}">${list.map(a => teamAgentHTML(a, g)).join('')}</div>`;
  if (g.collapsed) {
    return `<details class="group" id="grp-other"${state.otherOpen ? ' open' : ''}>
      <summary>${h2}<span class="note">${esc(g.note)}</span><span class="more"><span class="team-show">Show</span><span class="team-hide">Hide</span></span></summary>
      ${cards}
    </details>`;
  }
  return `<section class="group" aria-labelledby="${hid}">
      ${h2}
      <p class="note group-note">${esc(g.note)}</p>
      ${cards}
    </section>`;
}

SCREENS.team = () => {
  const ceil = teamCeiling();
  const html = head(esc('Regulatory team'),
      esc('The whole regulatory function as agents. The playbook selects them from the asset’s stage and classification; you can switch any on or off. One person is read in and signs.')) +
  `<section class="sheet" aria-labelledby="h-people" style="margin-bottom:20px">
     <h2 id="h-people">People</h2>
     <div class="people">${teamPeopleHTML()}</div>
   </section>
   <section class="sheet" aria-labelledby="h-auto" style="margin-bottom:20px">
     <h2 id="h-auto">Autonomy</h2>
     <div class="ladder">${teamLadderHTML(ceil)}</div>
     <p class="note">Agents can earn more autonomy over time. This playbook caps them at L${ceil}.</p>
   </section>
   <p class="team-sum" aria-live="polite"><b>${selectedCount()} of ${DATA.agents.length} agents selected for this DD.</b> The MVP will build 6 to 8 of them; which ones is still an open question. The rest show the full library.</p>
   ${DATA.agentGroups.map(g => teamGroupHTML(g)).join('')}`;
  teamOpenSpecs = new Set();
  return html;
};

/* A person switches an agent on or off for this DD. Team roles are locked on. */
ACTIONS['toggle-agent'] = el => {
  const a = agentById(el.dataset.id);
  if (!a || a.locked) return;
  const on = !state.selected.has(a.id);
  if (on) state.selected.add(a.id); else state.selected.delete(a.id);
  const c = DATA.request.classes.find(x => x.agent === a.id);   // keep the asset classification in step
  if (c) { if (on) state.cls.add(c.id); else state.cls.delete(c.id); }
  const name = agentName(a.id);
  addLog(LEAD, 'person', on ? `selected the ${name} agent for this DD.` : `deselected the ${name} agent for this DD.`);
  teamOpenSpecs = new Set($$('#main details.spec[open]').map(d => d.dataset.id));
  renderHeader();
  render({ focus: 'id:sw-' + a.id });
  toast(on ? `${name}: selected for this DD` : `${name}: not selected`);
};

/* ======================= frag-run.js ======================= */
/* Run board (route "run"): the standard workflow, every regulatory activity on a
   five-column board from backlog to the RA DD lead's sign-off, what needs the lead
   now, and the activity log. Only a person's click moves a card to Signed off. */

/* Count with the right noun: "1 activity", "19 activities". */
function runCount(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

/* A role name used mid-sentence: "Paediatric regulatory expert" -> "paediatric ...".
   Acronyms stay as they are ("CMC regulatory expert"). */
function runLower(s) { return String(s || '').replace(/^[A-Z](?=[a-z])/, c => c.toLowerCase()); }

/* The v1 stepper. */
function runStepsHTML() {
  return DATA.steps.map((s, i) => {
    const st = i < DATA.currentStep ? 'done' : (i === DATA.currentStep ? 'current' : 'next');
    const label = st === 'done' ? `${ICON.check}Done` : st === 'current' ? `${ICON.dot}Current` : 'Next';
    return `<li class="step ${st}"${st === 'current' ? ' aria-current="step"' : ''}><span class="mono">${String(i + 1).padStart(2, '0')}</span>${esc(s)}<br><span class="state">${label}</span></li>`;
  }).join('');
}

/* Signed card: the lead's initials in ink, with the time it was signed off. */
function runSignedByHTML(a) {
  const t = actSignedAt(a);
  const anim = !!state.justSigned && (state.justSigned === a.id || state.justSigned === a.finding);
  return `<p class="signed-by"><span class="sig${anim ? ' anim' : ''}" aria-hidden="true">${esc(LEAD_INITIALS)}</span>` +
    `<span class="when" aria-hidden="true">${esc(LEAD)}${t ? ' · ' + esc(t) : ''}</span>` +
    `<span class="visually-hidden">Signed off by ${esc(LEAD)}${t ? ' at ' + esc(t) : ''}</span></p>`;
}

/* Unsigned card with a finding: flags (what it waits on), actions (Sign off first) and,
   when it cannot be signed yet, the reason. */
function runCardWorkHTML(a, f, col) {
  let flags = '';
  const rid = a.request || f.request;
  const r = rid ? reqById(rid) : null;
  const rs = r ? reqStatus(r) : '';
  if (rs === 'sent') flags += `<p class="flag wait">Waiting on licensor: ${refBtn(r.id)}</p>`;
  else if (rs === 'draft') flags += `<p class="flag">Request ${refBtn(r.id)} awaits your approval</p>`;
  if (f.challenge.state === 'open') flags += `<p class="flag">Red team: challenge open</p>`;
  const ex = expertOf(f);
  if (ex.state === 'sent') flags += `<p class="flag wait">With the ${esc(runLower(ex.reviewer))}${ex.when ? ' since ' + esc(ex.when) : ''}</p>`;
  else if (ex.state === 'returned') flags += `<p class="flag ok">Expert view back</p>`;

  const block = signBlock(f);
  const btns = [];
  if (block === '') {
    btns.push(`<button type="button" class="btn btn-primary btn-sm" data-action="sign-act" data-id="${esc(a.id)}" aria-label="Sign off ${esc(a.id)}: ${esc(a.title)}">Sign off</button>`);
  }
  if (ex.state === 'drafted') {
    btns.push(`<button type="button" class="btn btn-sm" data-action="review-redaction" data-id="${esc(f.id)}" aria-label="Review redaction for ${esc(f.id)}">Review redaction</button>`);
  } else if (ex.state === 'none' && DATA.sanitised[f.id] && col === 'review') {
    btns.push(`<button type="button" class="btn btn-sm" data-action="ask-expert" data-id="${esc(f.id)}" aria-label="Ask a cleared expert about ${esc(f.id)}">Ask a cleared expert</button>`);
  }
  const acts = btns.length ? `<div class="card-actions">${btns.join('')}</div>` : '';
  const why = block && block !== 'done' ? `<p class="col-note">${esc(block)}</p>` : '';
  return flags + acts + why;
}

/* One activity card. Cards without a finding carry no flags and no actions. */
function runCardHTML(a) {
  const col = actColOf(a);
  const signed = col === 'signed';
  const f = a.finding ? findingById(a.finding) : null;
  const body = signed ? runSignedByHTML(a) : (f ? runCardWorkHTML(a, f, col) : '');
  return `<li class="card${signed ? ' signed' : ''}" id="card-${esc(a.id)}" tabindex="-1">` +
    `<p class="cid"><span><span class="visually-hidden">Activity </span>${esc(a.id)}</span>${f ? refBtn(f.id) : ''}</p>` +
    `<h3 class="${signed ? 'ink' : 'pencil'}">${esc(a.title)}</h3>` +
    `<p class="by">${ICON.pencil}<span><span class="visually-hidden">Agent: </span>${esc(agentName(a.agent))}</span></p>` +
    body + `</li>`;
}

/* One board column: heading with its count, the column note, then its visible cards. */
function runColHTML(c, visible) {
  const items = visible.filter(a => actColOf(a) === c.id);
  const hid = 'colh-' + esc(c.id);
  return `<section class="col">
      <h3 class="col-h" id="${hid}"><span>${esc(c.label)}</span> <span class="mono">${items.length}<span class="visually-hidden"> ${items.length === 1 ? 'activity' : 'activities'}</span></span></h3>
      <p class="col-note">${esc(c.note)}</p>
      <ul class="cards" aria-labelledby="${hid}">${items.length ? items.map(runCardHTML).join('') : `<li class="col-empty">Nothing here.</li>`}</ul>
    </section>`;
}

/* Needs you: derived from the current state, in a fixed order. */
function runQueueItems() {
  const mono = id => `<span class="mono">${esc(id)}</span>`;
  const item = (text, btn) => `<li><span>${text}</span>${btn}</li>`;
  const out = [];
  DATA.findings.filter(f => expertOf(f).state === 'drafted').forEach(f => out.push(item(
    `Approve the sanitised question on ${mono(f.id)} before it goes to a cleared expert`,
    `<button type="button" class="btn btn-sm" data-action="review-redaction" data-id="${esc(f.id)}" aria-label="Review redaction for ${esc(f.id)}">Review redaction</button>`)));
  DATA.requests.filter(r => reqStatus(r) === 'draft').forEach(r => out.push(item(
    `Approve request ${mono(r.id)} to the licensor`,
    `<button type="button" class="btn btn-sm" data-action="open-request" data-id="${esc(r.id)}" aria-label="Open request ${esc(r.id)}">Open</button>`)));
  DATA.findings.filter(f => state.selected.has(f.prepared) && signBlock(f) === '').forEach(f => out.push(item(
    `${mono(f.id)} is ready for your sign-off`,
    `<button type="button" class="btn btn-sm" data-action="open-finding" data-id="${esc(f.id)}" aria-label="Open finding ${esc(f.id)}">Open</button>`)));
  DATA.knowledge.docs.filter(d => state.release[d.id] === 'undecided').forEach(d => out.push(item(
    `Decide whether the agents may read ${esc(d.name)}`,
    `<button type="button" class="btn btn-sm" data-action="go-knowledge" aria-label="Open the release choice for ${esc(d.name)}">Open</button>`)));
  return out;
}

/* Activity log: this session's entries first, then the loaded feed. */
function runFeedHTML() {
  const cls = { person: 'person-entry', agent: 'agent-entry', reviewer: 'rev-entry', external: 'ext-entry' };
  return state.log.concat(DATA.feed).map(e =>
    `<li><time>${esc(e.t)}</time><span class="${cls[e.kind] || 'agent-entry'}"><span class="actor">${esc(e.actor)}</span> ${linkify(e.text)}</span></li>`).join('');
}

SCREENS.run = () => {
  const visible = DATA.activities.filter(a => state.selected.has(a.agent));
  const hidden = DATA.activities.length - visible.length;
  const countText = runCount(visible.length, 'activity', 'activities') + ' · ' + (hidden
    ? `${hidden} hidden: ${hidden === 1 ? 'its agent is' : 'their agents are'} not selected`
    : 'all agents selected');
  const queue = runQueueItems();

  return head('Run board', `Regulatory activities only, each assigned to an agent. Nothing is done until the ${esc(LEAD)} signs it off.`,
      `<span class="tag">Step ${DATA.currentStep + 1} of ${DATA.steps.length}: ${esc(DATA.steps[DATA.currentStep])}</span>`) +
  `<section class="sheet" aria-labelledby="h-steps">
    <h2 id="h-steps">Standard workflow</h2>
    <ol class="stepper">${runStepsHTML()}</ol>
  </section>
  <section class="sheet run-acts" aria-labelledby="h-acts">
    <h2 class="panel-h" id="h-acts">Activities <small>${esc(countText)}</small></h2>
    <div class="board">${DATA.columns.map(c => runColHTML(c, visible)).join('')}</div>
  </section>
  <div class="under-board">
    <section class="sheet" aria-labelledby="h-queue">
      <h2 id="h-queue">Needs you <small>${runCount(queue.length, 'item', 'items')}</small></h2>
      <ul class="queue">${queue.length ? queue.join('') : `<li class="q-empty">Nothing needs you right now.</li>`}</ul>
    </section>
    <section class="sheet" aria-labelledby="h-feed">
      <h2 id="h-feed">Activity <small>Today</small></h2>
      <ol class="feed">${runFeedHTML()}</ol>
    </section>
  </div>`;
};

/* Sign off an activity. With a finding, signing the finding moves every activity linked
   to it to Signed off; without one, the activity alone is signed. */
ACTIONS['sign-act'] = el => {
  const a = actById(el.dataset.id);
  if (!a || actColOf(a) === 'signed') return;
  if (a.finding) {
    const f = findingById(a.finding);
    const block = f ? signBlock(f) : 'done';
    if (block) { if (block !== 'done') toast(block); return; }
    signFinding(a.finding);
  } else {
    state.actCol[a.id] = 'signed';
    state.actSigned[a.id] = nowHHMM();
    state.justSigned = a.id;
    addLog(LEAD, 'person', `signed off ${a.id}.`);
  }
  render({ focus: 'card:' + a.id });
  toast('Signed off: ' + a.id);
};

/* ======================= frag-findings.js ======================= */
/* Findings and risks: filters, the table, the regulatory checklist, the record drawer
   (openFinding) and the sanitised-review drawer (openSanitised). Private helpers are
   prefixed "findings". */

/* Reviewer names sit mid-sentence: lower-case the first letter unless it starts an acronym (CMC). */
function findingsLc(s) {
  s = String(s || '');
  return /^[A-Z]{2,}/.test(s) ? s : s.charAt(0).toLowerCase() + s.slice(1);
}

function findingsList() {
  return DATA.findings.filter(f =>
    (!state.typeFilter.size || state.typeFilter.has(f.type)) &&
    (!state.stFilter.size || state.stFilter.has(statusOf(f))));
}

function findingsCountText(n) { return `Showing ${n} of ${DATA.findings.length} items`; }

/* Table: each source on its own line, with its tier. */
function findingsSources(f) {
  if (!f.sources.length) return '<span class="src nosrc">No source</span>';
  return f.sources.map(s =>
    `<span class="src">${esc(s.t)} <span class="nowrap">[illustrative]</span> ${tierTag(s.tier)}</span>`).join('');
}

function findingsRow(f) {
  const st = statusOf(f);
  const rejected = st === 'Rejected';
  const claimCls = rejected ? '' : (approvalOf(f).state === 'signed' ? 'ink' : 'pencil');
  const id = esc(f.id);
  return `<tr class="${rejected ? 'is-rejected' : ''}" data-row="${id}">
    <td class="c-id" data-label="ID"><button type="button" class="id-btn" id="fid-${id}" data-action="open-finding" data-id="${id}" aria-label="Open finding ${id}">${id}</button></td>
    <td data-label="Type">${typeTag(f.type)}</td>
    <td class="c-claim" data-label="Claim"><div><span class="${claimCls}"><span class="claim-text">${esc(f.claim)}</span></span>${rejected ? '<span class="reject-note">Rejected: no source, no finding</span>' : ''}</div></td>
    <td data-label="Evidence" class="pencil small">${esc(f.evidence)}</td>
    <td data-label="Source"><div>${findingsSources(f)}</div></td>
    <td data-label="Confidence"><span class="conf">${esc(f.confidence)}</span></td>
    <td data-label="Status">${statusChip(st)}</td>
    <td class="c-strip" data-label="Sign-off">${findingStrip(f, true)}</td>
  </tr>`;
}

/* Rows only: keeps the filter chips (and focus on them) in place. */
function findingsFill() {
  const body = $('#ftBody');
  if (!body) return;
  const list = findingsList();
  body.innerHTML = list.length
    ? list.map(findingsRow).join('')
    : '<tr><td colspan="8" class="empty">No items match these filters.</td></tr>';
  const rc = $('#resultCount'), txt = findingsCountText(list.length);
  if (rc && rc.textContent !== txt) rc.textContent = txt;
}

function findingsCheckItem(it) {
  let label = it.label, st = it.state, note = '';
  if (it.dyn === 'docs') {
    label = `Data room index read: ${releasedCount()} of ${vdrTotal()} documents released to the agents`;
    st = 'checked';
  } else if (it.dyn === 'filing') {
    label = 'Gap check against the NDA/MAA playbook (concept)';
    st = isLate() ? 'open' : 'na';
    if (!isLate()) note = 'Not applicable before Phase 3';
  }
  const ic = { checked: ICON.check, na: ICON.dash, open: ICON.dot, notchecked: ICON.dot, cannot: ICON.question, heor: ICON.arrow }[st] || ICON.dot;
  return `<li><span>${esc(label)}${it.ref ? ' ' + refBtn(it.ref) : ''}${note ? `<span class="ck-note">${esc(note)}</span>` : ''}</span>` +
    `<span class="ck ck-${esc(st)}">${ic}${esc(DATA.checklistStates[st])}</span></li>`;
}

SCREENS.findings = () => {
  const chip = (group, v, set) =>
    `<button type="button" class="chip" data-action="filter" data-group="${group}" data-value="${esc(v)}" aria-pressed="${set.has(v)}">${ICON.check}${esc(v)}</button>`;
  const ck = DATA.checklist.map(g =>
    `<div class="ck-group"><h3>${esc(g.group)}</h3><ul>${g.items.map(findingsCheckItem).join('')}</ul></div>`).join('');

  return head('Findings and risks', 'Every item uses the same format and has a source, or says plainly that it cannot be confirmed. Select a row for the full record, the red-team thread and any expert review.') +
  `<div class="findings-grid">
    <section aria-labelledby="h-ft">
      <h2 class="visually-hidden" id="h-ft">Findings and risks table</h2>
      <div class="filters">
        <div class="filter-group" role="group" aria-labelledby="fl-type"><span class="caps" id="fl-type">Type</span>${DATA.types.map(t => chip('type', t, state.typeFilter)).join('')}</div>
        <div class="filter-group" role="group" aria-labelledby="fl-st"><span class="caps" id="fl-st">Status</span>${DATA.statuses.map(s => chip('st', s, state.stFilter)).join('')}</div>
      </div>
      <div class="result-line"><span id="resultCount" aria-live="polite">${findingsCountText(findingsList().length)}</span><button type="button" class="btn btn-quiet btn-sm" data-action="clear-filters">Clear filters</button></div>
      <div class="table-wrap">
        <table class="ft">
          <colgroup><col style="width:56px"><col style="width:112px"><col><col><col style="width:168px"><col style="width:88px"><col style="width:144px"><col style="width:256px"></colgroup>
          <thead><tr><th scope="col">ID</th><th scope="col">Type</th><th scope="col">Claim</th><th scope="col">Evidence</th><th scope="col">Source</th><th scope="col">Confidence</th><th scope="col">Status</th><th scope="col">Sign-off</th></tr></thead>
          <tbody id="ftBody"></tbody>
        </table>
      </div>
    </section>
    <aside class="sheet checklist" aria-labelledby="h-ck">
      <h2 id="h-ck">Regulatory checklist</h2>
      <div class="ck-groups">${ck}</div>
      <p class="note">"Checked: not applicable", "not checked yet" and "could not confirm" are kept apart, so it is clear what was skipped and what could not be known.</p>
    </aside>
  </div>`;
};
AFTER.findings = () => findingsFill();

ACTIONS.filter = el => {
  const set = el.dataset.group === 'type' ? state.typeFilter : state.stFilter;
  const v = el.dataset.value;
  if (set.has(v)) set.delete(v); else set.add(v);
  el.setAttribute('aria-pressed', String(set.has(v)));
  findingsFill();
};
ACTIONS['clear-filters'] = () => {
  state.typeFilter.clear();
  state.stFilter.clear();
  $$('[data-action="filter"]').forEach(c => c.setAttribute('aria-pressed', 'false'));
  findingsFill();
};

/* ================= Record drawer ================= */
function findingsSourceList(f) {
  if (!f.sources.length) return '<span class="nosrc">No source attached</span>';
  return `<ul class="fnd-srcs">${f.sources.map(s =>
    `<li>${esc(s.t)} <span class="nowrap">[illustrative]</span> ${tierTag(s.tier)}</li>`).join('')}</ul>`;
}

/* Expert review: advice from a cleared reviewer who is not read in. Never a source. */
function findingsExpert(f) {
  const ex = expertOf(f), san = DATA.sanitised[f.id], id = esc(f.id);
  const who = esc(findingsLc(ex.reviewer || (san && san.reviewer) || 'cleared expert'));
  if (ex.state === 'drafted') {
    return `<p class="pencil fnd-say">The Sanitiser drafted a question for the ${who}. Nothing has left the workspace.</p>` +
      `<button type="button" class="btn btn-sm" data-action="review-redaction" data-id="${id}">Review redaction</button>`;
  }
  if (ex.state === 'sent' || ex.state === 'returned') {
    const box = san
      ? `<div class="san-box san-out"><h4>Sanitised question, as the expert saw it</h4><p>${sanParts(san.parts, 'out')}</p></div>` : '';
    if (ex.state === 'sent') {
      return box + `<p class="note">Sent to the ${who} at ${esc(ex.when)}. Cleared, not read in.</p>` +
        '<p class="pencil fnd-say">Waiting for the expert view.</p>';
    }
    return box + `<blockquote class="expert-view"><b>${esc(ex.reviewer)}</b> (not read in), ${esc(ex.back)}: “${esc(ex.view)}”</blockquote>` +
      '<p class="advice">Expert advice, not evidence. It never counts as a source.</p>';
  }
  if (ex.state === 'none' && san && statusOf(f) !== 'Rejected') {
    return '<p class="pencil fnd-say">No expert view requested.</p>' +
      `<button type="button" class="btn btn-sm" data-action="ask-expert" data-id="${id}">Ask a cleared expert</button>`;
  }
  return '<p class="pencil fnd-say">Not needed for this item.</p>';
}

function findingsThread(f) {
  if (!f.thread.length) return '<p class="pencil fnd-say">No challenge raised yet. The red team picks this up after the evidence check.</p>';
  return `<ol class="thread">${f.thread.map(m => {
    const cls = m.kind === 'person' ? 't-person' : 't-agent';
    const liCls = [m.who === 'Red team' ? 't-red' : '', m.open ? 't-open' : ''].filter(Boolean).join(' ');
    return `<li${liCls ? ` class="${liCls}"` : ''}><span class="meta"><b class="${cls}">${esc(m.who)}</b><span class="when">${esc(m.t)}</span>` +
      (m.kind === 'agent' ? `<span class="pencil">${ICON.pencil}<span class="visually-hidden">(agent)</span></span>` : '') +
      (m.open ? '<span class="visually-hidden">(open challenge)</span>' : '') +
      `</span><p class="${cls}">${linkify(m.text)}</p></li>`;
  }).join('')}</ol>`;
}

function openFinding(id) {
  const f = findingById(id);
  if (!f) return;
  const ap = approvalOf(f), st = statusOf(f);
  const rejected = st === 'Rejected', signed = ap.state === 'signed';
  const r = f.request ? reqById(f.request) : null;
  const doc = r && r.doc ? docById(r.doc) : null;
  const recheck = doc && state.release[doc.id] !== doc.release
    ? `<p class="recheck">Release changed for ${esc(doc.name)}: the agent will re-check this item.</p>` : '';
  const claim = rejected
    ? `<dd class="fnd-rej">${esc(f.claim)}<span class="reject-note">Rejected: no source, no finding</span></dd>`
    : `<dd class="${signed ? 'ink' : 'pencil'}">${esc(f.claim)}</dd>`;
  const confirmed = signed ? `<dd class="ink">${esc(LEAD)}, ${esc(ap.when)}</dd>`
    : ap.state === 'rejected' ? '<dd>Not for approval</dd>' : '<dd>Not yet</dd>';

  // Opened by clicking the row itself (focus lands on the page body or on #main, which has
  // tabindex -1): park focus on the row's ID button so Close and Escape return to this row.
  const active = document.activeElement;
  if ($('#drawer').hidden && (!active || active === document.body || active === $('#main'))) {
    const b = document.getElementById('fid-' + f.id);
    if (b) b.focus({ preventScroll: true });
  }

  showDrawer(`
    <div class="drawer-head">
      <h2 id="drawerTitle"><span class="mono">${esc(f.id)} · ${esc(f.type)}</span>Record</h2>
      <button type="button" class="btn btn-quiet btn-sm" data-action="close-drawer">Close</button>
    </div>
    ${findingStrip(f, false)}
    ${recheck}
    <dl class="record">
      <dt>Type</dt><dd>${typeTag(f.type)}<span class="type-note">${esc(DATA.typeNotes[f.type] || '')}</span></dd>
      <dt>Claim</dt>${claim}
      <dt>Evidence</dt><dd class="pencil">${linkify(f.evidence)}</dd>
      <dt>Sources</dt><dd>${findingsSourceList(f)}</dd>
      <dt>Confidence</dt><dd>${esc(f.confidence)}</dd>
      <dt>Assumptions</dt><dd class="pencil">${linkify(f.assumptions)}</dd>
      <dt>Status</dt><dd>${statusChip(st)}</dd>
      <dt>Owner</dt><dd>${esc(LEAD)}, the only person read in</dd>
      <dt>Drafted by</dt><dd class="pencil">${esc(agentName(f.prepared))} agent</dd>
      <dt>Confirmed by</dt>${confirmed}
      <dt>Licensor request</dt><dd>${r ? refBtn(r.id) + ' ' + reqChip(reqStatus(r)) : 'None'}</dd>
    </dl>
    <h3>Expert review (sanitised)</h3>
    ${findingsExpert(f)}
    <h3>Red-team challenge thread</h3>
    ${findingsThread(f)}`);
}

/* ================= Sanitised-review drawer ================= */
function openSanitised(fid) {
  const f = findingById(fid), san = DATA.sanitised[fid];
  if (!f || !san) return;
  const ex = expertOf(f);
  if (ex.state === 'sent' || ex.state === 'returned') { openFinding(fid); return; }   // already left the workspace
  const id = esc(fid);
  const opts = DATA.access.reviewers.map(r =>
    `<option value="${esc(r)}"${r === san.reviewer ? ' selected' : ''}>${esc(r)}</option>`).join('');
  showDrawer(`
    <div class="drawer-head">
      <h2 id="drawerTitle"><span class="mono">${id} · Sanitised expert review</span>Check the redaction</h2>
      <div class="actions">
        <button type="button" class="btn btn-quiet btn-sm" data-action="back-to-finding" data-id="${id}">Back to ${id}</button>
        <button type="button" class="btn btn-quiet btn-sm" data-action="close-drawer">Close</button>
      </div>
    </div>
    <p class="lede fnd-lede">The Sanitiser drafted this question. Nothing leaves the workspace until you approve it.</p>
    <div class="san-box">
      <h3>What you see</h3>
      <p>${sanParts(san.parts, 'full')}</p>
      <p class="san-key"><span class="visually-hidden">Key:</span><span class="will-redact">Removed</span> <span class="will-gen">Generalised</span></p>
    </div>
    <div class="san-box san-out">
      <h3>What the expert sees</h3>
      <p>${sanParts(san.parts, 'out')}</p>
    </div>
    <h3>Checks by the Sanitiser</h3>
    <ul class="checks">${DATA.sanChecks.map(c => `<li class="pencil">${ICON.check}<span>${esc(c)}</span></li>`).join('')}</ul>
    <div class="field fnd-field"><label for="sanReviewer">Send to a cleared reviewer</label><select class="input" id="sanReviewer">${opts}</select></div>
    <label class="confirm"><input type="checkbox" id="sanConfirm" data-action="san-confirm"><span>${esc(DATA.sanConfirm)}</span></label>
    <p class="note">${esc(DATA.sanWarning)}</p>
    <div class="actions fnd-actions">
      <button type="button" class="btn btn-primary" id="sanSend" data-action="approve-expert" data-id="${id}" disabled>Approve and send</button>
      <button type="button" class="btn btn-quiet" data-action="back-to-finding" data-id="${id}">Cancel</button>
    </div>`);
}

/* Re-render after an action on a finding. If the focus target is gone (row filtered out,
   card hidden because its agent is not selected), fall back to the screen title. */
function findingsRefocus(fid, actId) {
  render({ focus: focusAfter(fid, actId) });
  if (!$('#main').contains(document.activeElement)) { const t = $('#screenTitle'); t && t.focus(); }
}

ACTIONS['open-finding'] = el => openFinding(el.dataset.id);
ACTIONS['ask-expert'] = el => openSanitised(el.dataset.id);
ACTIONS['review-redaction'] = el => openSanitised(el.dataset.id);
ACTIONS['back-to-finding'] = el => openFinding(el.dataset.id);

ACTIONS['sign-finding'] = el => {
  const id = el.dataset.id, f = findingById(id);
  if (!f || signBlock(f)) return;
  const actId = signFinding(id);
  closeDrawer(true);
  findingsRefocus(id, actId);
  toast('Signed: ' + id);
};

CHANGES['san-confirm'] = el => {
  const b = $('#sanSend');
  if (b) b.disabled = !el.checked;
};

ACTIONS['approve-expert'] = el => {
  const fid = el.dataset.id, f = findingById(fid), san = DATA.sanitised[fid];
  if (!f || !san) return;
  const box = $('#sanConfirm');
  if (!box || !box.checked) { if (box) box.focus(); return; }
  const ex = expertOf(f);
  if (ex.state !== 'drafted' && ex.state !== 'none') return;
  const sel = $('#sanReviewer');
  const reviewer = (sel && sel.value) || san.reviewer;
  state.expert[fid] = { state: 'sent', reviewer: reviewer, when: nowHHMM() };
  let actId = null;
  DATA.activities.filter(a => a.finding === fid).forEach(a => {
    if (actColOf(a) !== 'signed') { state.actCol[a.id] = 'expert'; actId = a.id; }
    else if (!actId) actId = a.id;
  });
  const who = findingsLc(reviewer);
  addLog(LEAD, 'person', `approved the sanitised question on ${fid} for the ${who}.`);
  closeDrawer(true);
  findingsRefocus(fid, actId);
  toast(`Sent to the ${who}. Not read in.`);
};

/* ======================= frag-requests.js ======================= */
/* Licensor requests: every request with its timestamped trail, the ring-fenced
   repository its answers land in, and what "not provided" can mean. */

/* Time cell of a trail row. No time yet shows a dash; a screen reader hears "Not yet". */
function requestsTimeHTML(t) {
  return t ? `<time class="tm">${esc(t)}</time>`
    : `<span class="tm"><span aria-hidden="true">–</span><span class="visually-hidden">Not yet</span></span>`;
}

/* Drafted; approved and sent (or awaiting you); answered or not (or awaiting the licensor); filed. */
function requestsTrailHTML(r, st) {
  const row = (t, body) => `<li>${requestsTimeHTML(t)}${body}</li>`;
  const dr = r.drafted || {};
  const rows = [row(dr.t, `<div class="t-agent">${ICON.pencil} Drafted by ${dr.by ? `the ${esc(dr.by)} agent` : 'an agent'}</div>`)];
  if (st === 'draft') {
    rows.push(row('', `<div><span class="await">Awaiting ${esc(LEAD)}</span> ` +
      `<button type="button" class="btn btn-primary btn-sm" data-action="approve-request" data-id="${esc(r.id)}" aria-label="Approve and send ${esc(r.id)} to the licensor">Approve and send</button></div>`));
  } else {
    rows.push(row(reqSentAt(r), `<div class="t-person">Approved and sent by ${esc(LEAD)} through ${esc(DATA.requestChannel)}</div>`));
    if (st === 'sent') {
      rows.push(row('', `<div class="pencil">Awaiting the licensor.${r.due ? ` Due ${esc(r.due)}.` : ''}</div>`));
    } else {
      const c = r.closed || {};
      rows.push(row(c.t, `<div class="t-ext"><b>Licensor:</b> ${esc(DATA.requestStatuses[st] || st)}` +
        `${c.note ? `<span class="quote">${esc(c.note)}</span>` : ''}</div>`));
    }
  }
  const doc = r.doc && docById(r.doc);
  if (doc) {
    rows.push(row(r.closed && r.closed.t, `<div>Filed in the ring-fenced DD repository: <b>${esc(doc.name)}</b> ${relSelect(doc, 'req-' + r.id)}</div>`));
  }
  return `<ol class="trail">${rows.join('')}</ol>`;
}

/* One request. Focus target for 'req:R-xx'; its name is the id plus the current status. */
function requestsArticleHTML(r) {
  const st = reqStatus(r), id = esc(r.id);
  return `<article class="req" id="req-${id}" tabindex="-1" aria-labelledby="reqn-${id} reqst-${id}">
      <div class="req-top">
        <h2 class="req-h"><span id="reqn-${id}"><span class="visually-hidden">Licensor request </span><span class="mono">${id}</span></span>${r.finding ? `<span>from ${refBtn(r.finding)}</span>` : ''}</h2>
        <span id="reqst-${id}">${reqChip(st)}</span>
      </div>
      <p class="req-q ${st === 'draft' ? 'pencil' : 'ink'}">${esc(r.text)}</p>
      ${requestsTrailHTML(r, st)}
    </article>`;
}

/* One status chip per status present, with its count. */
function requestsSummaryHTML() {
  const chips = Object.keys(DATA.requestStatuses).map(st => {
    const n = DATA.requests.filter(r => reqStatus(r) === st).length;
    return n ? `<span class="rstat rs-${esc(st)}"><b>${n}</b> ${esc(DATA.requestStatuses[st])}</span>` : '';
  }).join('');
  return `<div class="req-sum" role="group" aria-labelledby="reqSumLabel"><span class="caps" id="reqSumLabel">Requests by status</span>${chips}</div>`;
}

SCREENS.requests = () => {
  const list = DATA.requests.length
    ? DATA.requests.map(requestsArticleHTML).join('')
    : `<p class="empty">No requests to the licensor yet.</p>`;
  const repo = DATA.knowledge.docs.filter(d => d.kind === 'response').map(d => docRow(d, 'repo')).join('');
  const np = ['declined', 'absent', 'silent'].map(k =>
    `<dt>${reqChip(k)}</dt><dd>${esc(DATA.requestStatusNotes[k])}</dd>`).join('');

  return head('Licensor requests', 'A gap starts a request to the licensor, with a timestamp. Answers land in a ring-fenced repository only the DD team can open. If nothing comes back, the record says why.') +
  requestsSummaryHTML() +
  `<div class="req-grid">
    <div>${list}</div>
    <div class="stack">
      <section class="sheet" aria-labelledby="h-reqrepo">
        <h2 id="h-reqrepo">Ring-fenced DD repository <small>DD team only</small></h2>
        <p class="note" style="margin-top:0">Only the DD team can open it. Agents read a document only after you release it.</p>
        <ul class="docs">${repo || '<li><span class="pencil">Nothing filed yet.</span></li>'}</ul>
      </section>
      <section class="sheet" aria-labelledby="h-reqnp">
        <h2 id="h-reqnp">When nothing comes back</h2>
        <dl class="np">${np}</dl>
        <p class="note">"Not provided" always says which of the three it is, so the briefing never treats silence as an answer.</p>
      </section>
    </div>
  </div>`;
};

/* Only a person's click sends a request to the licensor, and only from draft. */
ACTIONS['approve-request'] = el => {
  const id = el.dataset.id, r = reqById(id);
  if (!r || reqStatus(r) !== 'draft') return;
  state.req[id] = { status: 'sent', t: nowHHMM() };
  addLog(LEAD, 'person', `approved and sent ${id} to the licensor.`);
  render({ focus: 'req:' + id });
  toast('Sent to the licensor: ' + id);
};

/* ======================= frag-briefing.js ======================= */
/* ---------------------------------------------------------
   Briefing (SCREENS.briefing) and Architecture (SCREENS.architecture).
   Actions: sign (decisions D-1..D-3), export, feedback, layer.
   Private helpers are prefixed briefing* and architecture*.
   --------------------------------------------------------- */

/* ================= Briefing ================= */
function briefingSignedCount() { return DATA.decisions.filter(d => state.signed[d.id]).length; }
function briefingCountText() { return `${briefingSignedCount()} of ${DATA.decisions.length} signed`; }
function briefingDocStatus() { return briefingSignedCount() === DATA.decisions.length ? 'Signed by people' : 'Draft in pencil'; }
/* The session log names people the way the rest of the log does: "RA DD lead", not "RA DD lead (you)". */
function briefingSigner(dc) { return dc.owner === LEAD_YOU ? LEAD : dc.owner; }

/* The filing-readiness line follows the stage set on the Request screen: it never says
   "not applicable" once a filing is near, and it names the stage actually set (DATA says
   Phase 2). Every other statement is DATA as written. */
function briefingStmtText(it) {
  if (!/^Filing readiness/.test(it.s)) return it.s;
  if (isLate()) {
    return `Filing readiness against the NDA/MAA playbook (concept): gap check open, because a filing is near (${state.stage}).`;
  }
  return it.s.replace(/not applicable at Phase \d/, 'not applicable at ' + state.stage);
}

function briefingDecisionCard(dc) {
  const when = state.signed[dc.id];
  const approval = when
    ? { state: 'signed', role: dc.owner, initials: dc.initials, when: when }
    : { state: 'awaiting', role: dc.owner };
  const hid = 'dech-' + dc.id;
  return `<div class="decision" role="group" aria-labelledby="${esc(hid)}" data-decision="${esc(dc.id)}">
    <h3 id="${esc(hid)}">${esc(dc.title)}</h3>
    <p class="owner">Owner: <b>${esc(dc.owner)}</b></p>
    <p class="decision-body ${when ? 'ink' : 'pencil'}">${dc.prepared && !when ? ICON.pencil : ''}<span>${linkify(dc.draft)}</span></p>
    ${strip({ prepared: dc.prepared, challenge: dc.challenge, approval: approval, action: 'sign', id: dc.id })}
  </div>`;
}

SCREENS.briefing = () => {
  const B = DATA.briefing;
  const sections = B.sections.map(s =>
    `<h2>${esc(s.h)}</h2><ul class="stmts">${s.items.map(it =>
      `<li>${esc(briefingStmtText(it))}${it.refs && it.refs.length ? ` <span class="mono nowrap">[${refs(it.refs)}]</span>` : ''}</li>`).join('')}</ul>`).join('');
  const ptrs = B.ptrs.map(p =>
    `<tr><td>${esc(p.input)}</td><td>${esc(p.value)}</td><td class="mono">${refs(p.refs)}</td></tr>`).join('');
  const rejected = DATA.findings.filter(f => statusOf(f) === 'Rejected').map(f => f.id);

  return head('Briefing', 'Drafted by the Synthesiser from verified findings. People sign the decisions.') +
  `<div class="brief-grid">
    <article class="doc" aria-labelledby="docTitle">
      <div class="doc-ctl">
        <div><span>Document</span>${esc(DATA.dd.id)}-BR</div>
        <div><span>Asset</span>${esc(DATA.dd.asset)}</div>
        <div><span>Prepared by</span>${esc(agentName('syn'))}</div>
        <div><span>Status</span><b id="docStatus">${esc(briefingDocStatus())}</b></div>
      </div>
      <h1 id="docTitle">${esc(B.title)}</h1>
      <p class="doc-sub">For the cross-functional DD discussion · ${state.mode === 'reactive' ? 'Reactive DD' : 'Planned DD'}</p>
      <p class="doc-notice">${esc(B.notice)}</p>
      <p class="doc-draftnote">${ICON.pencil}Statements stay in pencil: an agent wrote them. Each links to its finding or request.</p>
      ${sections}
      <h2 id="h-ptrs">PTRS inputs</h2>
      <p class="pencil" style="font-size:14px;margin-bottom:8px">Regulatory part only. These are inputs for the calculation, not a score.</p>
      <table class="ptrs" aria-labelledby="h-ptrs"><thead><tr><th scope="col">Input</th><th scope="col">What the findings say</th><th scope="col">Findings</th></tr></thead><tbody>${ptrs}</tbody></table>
      ${rejected.length ? `<p class="excluded">Left out of this briefing: ${refs(rejected)}, rejected because no source was attached.</p>` : ''}
    </article>

    <div class="stack">
      <section class="sheet" aria-labelledby="h-dec">
        <h2 id="h-dec">Decisions reserved for people <span class="dec-count" id="decCount" aria-live="polite">${briefingCountText()}</span></h2>
        ${DATA.decisions.map(briefingDecisionCard).join('')}
      </section>
      <section class="sheet" aria-labelledby="h-exp">
        <h2 id="h-exp">Export</h2>
        <div class="actions">
          <button type="button" class="btn btn-quiet" data-action="export">Export as a document</button>
          <button type="button" class="btn btn-quiet" data-action="export">Export as slides</button>
        </div>
      </section>
      <section class="sheet" aria-labelledby="h-fb">
        <h2 id="h-fb">Learn</h2>
        <div class="field">
          <label for="feedback">Send feedback to agent owners</label>
          <textarea class="input" id="feedback" placeholder="What should the agents do better next time?" aria-describedby="fbHint"></textarea>
          <span class="note" id="fbHint" style="margin-top:2px">Agent owners use this to improve their agent before the next DD.</span>
        </div>
        <div class="actions" style="margin-top:12px"><button type="button" class="btn" data-action="feedback">Send feedback</button></div>
      </section>
    </div>
  </div>`;
};

/* The signing moment: ink the decision in place, so focus and the animation stay where the person clicked. */
ACTIONS.sign = el => {
  const id = el.dataset.id;
  const dc = DATA.decisions.find(x => x.id === id);
  if (!dc || state.signed[id]) return;
  const when = nowHHMM();
  state.signed[id] = when;
  const card = el.closest('.decision');
  const cell = el.closest('.cell-appr');
  const animate = !reducedMotion.matches;
  if (cell) {
    cell.classList.remove('is-awaiting');
    cell.classList.add('is-signed');
    cell.innerHTML = signedInner(dc.owner, dc.initials, when, animate);
    cell.setAttribute('aria-label', `Approved by ${dc.owner}, initials ${dc.initials}, signed ${when}`);
    cell.setAttribute('tabindex', '-1');
    if (animate) {
      // The stroke reveal is a CSS animation; drop the class afterwards so the
      // final inked state never depends on the animation completing.
      const sig = $('.sig', cell);
      setTimeout(() => { if (sig) sig.classList.remove('anim'); }, 700);
    }
  }
  const body = card && $('.decision-body', card);
  if (body) {
    body.classList.remove('pencil');
    body.classList.add('ink');
    const pic = $(':scope > .ic', body);
    if (pic) pic.remove();
  }
  const count = $('#decCount');
  if (count) count.textContent = briefingCountText();
  const status = $('#docStatus');
  if (status) status.textContent = briefingDocStatus();
  addLog(briefingSigner(dc), 'person', `signed ${dc.id}: ${dc.title}.`);
  if (cell) cell.focus();
  toast('Signed');
};

ACTIONS.export = () => toast('Export is not part of the mockup');

ACTIONS.feedback = () => {
  const ta = $('#feedback');
  if (!ta) return;
  if (!ta.value.trim()) {
    ta.focus();
    ta.setAttribute('placeholder', 'Write your feedback first, then send it.');
    return;
  }
  ta.value = '';
  addLog(LEAD, 'person', 'sent feedback to the agent owners.');
  toast('Feedback sent');
};

/* ================= Architecture ================= */
function architectureLayerDetail() {
  const l = DATA.layers.find(x => x.id === state.layer) || DATA.layers[0];
  return `<h2 id="h-layer">${esc(l.name)}</h2>
    <dl>
      <dt>What it holds</dt><dd><ul class="dots">${l.holds.map(h => `<li>${esc(h)}</li>`).join('')}</ul></dd>
      <dt>Who owns it</dt><dd>${esc(l.owner)}</dd>
      <dt>Why</dt><dd>${esc(l.why)}</dd>
    </dl>`;
}

/* Who sees what: the lead and the agents work together inside the wall; cleared experts
   sit outside it and get only sanitised questions the lead approves. */
function architectureConfModel() {
  const m = DATA.confModel;
  return `<div class="cm">
    <div class="cm-row">
      <span class="cm-box">${esc(m.lead)}<small>${esc(m.leadSub)}</small></span>
      <span class="cm-arrow" aria-hidden="true">⇄</span><span class="visually-hidden">works with</span>
      <span class="cm-box">${esc(m.agents)}<small>${esc(m.agentsSub)}</small></span>
    </div>
    <p class="cm-chan">${esc(m.channel)}</p>
    <div class="cm-row"><span class="cm-box out">${esc(m.experts)}<small>${esc(m.expertsSub)}</small></span></div>
  </div>`;
}

SCREENS.architecture = () => {
  const layers = DATA.layers.slice().reverse().map(l => {
    const idx = DATA.layers.indexOf(l) + 1;
    const on = state.layer === l.id;
    return `<button type="button" class="layer${idx === 1 ? ' foundation' : ''}" data-action="layer" data-id="${esc(l.id)}" aria-pressed="${on}" aria-controls="layerDetail">
      <span class="ln" aria-hidden="true">${idx}</span><span class="lt">${esc(l.name)}</span><span class="chev">${on ? 'Shown' : 'Show'}</span>
      <span class="ls">${esc(l.summary)}</span>
      ${l.chips ? `<span class="lchips">${l.chips.map(c => `<span class="${esc(c.c)}">${esc(c.t)}</span>`).join('')}</span>` : ''}
    </button>`;
  }).join('');

  return head('How the team is built', 'Five layers inside one frame of human accountability. Select a layer to see what it holds.',
      `<span class="tag proposal">Proposal, pending team decision</span>`) +
  `<div class="arch-grid">
    <div>
      <figure class="frame" aria-labelledby="frameCap">
        <div class="frame-head"><b id="frameCap">Human accountability</b>${DATA.humanRoles.map(r => `<span class="role-chip">${esc(r)}</span>`).join('')}</div>
        <div class="layers">${layers}</div>
      </figure>
      <p class="up-note"><span>Read from the bottom up: 1 is the foundation.</span><span>People sit around every layer, not on top of one.</span></p>
    </div>
    <div class="stack">
      <section class="sheet detail" id="layerDetail" aria-live="polite" aria-labelledby="h-layer">${architectureLayerDetail()}</section>
      <section class="sheet" aria-labelledby="h-cm">
        <h2 id="h-cm">Confidentiality model</h2>
        ${architectureConfModel()}
      </section>
      <section class="sheet stack" aria-label="Design rules" style="gap:16px">
        ${DATA.archCallouts.map(c => `<p class="callout"><b>${esc(c.h)}</b>${esc(c.t)}</p>`).join('')}
      </section>
    </div>
  </div>`;
};

ACTIONS.layer = el => {
  const l = DATA.layers.find(x => x.id === el.dataset.id);
  if (!l) return;
  state.layer = l.id;
  $$('.layer[data-action="layer"]').forEach(b => {
    const on = b.dataset.id === state.layer;
    b.setAttribute('aria-pressed', String(on));
    const chev = $('.chev', b);
    if (chev) chev.textContent = on ? 'Shown' : 'Show';
  });
  const detail = $('#layerDetail');
  if (detail) detail.innerHTML = architectureLayerDetail();
};

/* ================= Core actions ================= */
ACTIONS.skip = () => $('#main').focus();
ACTIONS['close-drawer'] = () => closeDrawer();
ACTIONS['open-request'] = el => { closeDrawer(true); go('requests', 'req:' + el.dataset.id); };
ACTIONS['go-knowledge'] = () => { closeDrawer(true); go('request', 'id:h-know'); };

/* ================= Header ================= */
function renderHeader() {
  const d = DATA.dd;
  const parts = [
    esc(d.id), esc(d.asset),
    state.mode === 'reactive' ? 'Reactive DD' : 'Planned DD',
    `<span class="due">Due in ${esc(d.due[state.mode])}</span>`,
    'Read in: 1 person',
    `Agents: ${selectedCount()} selected`,
    `Autonomy ceiling: ${esc(d.ceiling)}`
  ];
  $('#docControl').innerHTML = parts.map(p => `<span class="nowrap">${p}</span>`).join('<span class="sep" aria-hidden="true">·</span><wbr>');
  $('#lgPencil').innerHTML = `${ICON.pencil}<span>Pencil = drafted by an agent.</span>`;
}

/* ================= Tabs ================= */
function renderTabs() {
  $('#tabs').innerHTML = DATA.routes.map(r => {
    const sel = r.id === state.route;
    return `<button type="button" role="tab" id="tab-${r.id}" class="tab${r.n ? '' : ' arch'}" aria-selected="${sel}" aria-controls="main" tabindex="${sel ? 0 : -1}" data-route="${r.id}">` +
      (r.n ? `<span class="n" aria-hidden="true">${r.n}</span>` : `<span class="n" aria-hidden="true"></span>`) +
      `<span>${esc(r.label)}</span></button>`;
  }).join('');
  $('#main').setAttribute('aria-labelledby', 'tab-' + state.route);
}

/* ================= Router ================= */
function routeFromHash() {
  const h = (location.hash || '').replace('#', '');
  return SCREENS[h] ? h : 'request';
}
/* opts.focus: 'title' | 'tab' | 'req:R-05' | 'card:A-11' | 'id:<element id>' */
function render(opts) {
  state.route = routeFromHash();
  renderTabs();
  $('#main').innerHTML = SCREENS[state.route]();
  if (AFTER[state.route]) AFTER[state.route]();
  window.scrollTo(0, 0);
  document.title = DATA.routes.find(r => r.id === state.route).label + ' · DD workspace · UX mockup v2';
  const f = opts && opts.focus;
  if (f === 'title') { const t = $('#screenTitle'); t && t.focus(); }
  else if (f === 'tab') { const t = $('#tab-' + state.route); t && t.focus(); }
  else if (f) focusTarget(f);
  if (narrow.matches) keepTabInView();
  if (state.justSigned) {
    // The stroke reveal runs as a CSS animation; drop the class afterwards so the
    // final inked state never depends on the animation completing.
    state.justSigned = null;
    setTimeout(() => $$('.sig.anim').forEach(s => s.classList.remove('anim')), 700);
  }
}
function focusTarget(f) {
  const i = f.indexOf(':');
  const kind = f.slice(0, i), id = f.slice(i + 1);
  const el = kind === 'req' ? document.getElementById('req-' + id)
    : kind === 'card' ? document.getElementById('card-' + id)
    : document.getElementById(id);
  if (!el) return;
  el.focus({ preventScroll: true });
  el.scrollIntoView({ block: 'center' });
  if (kind === 'req' || kind === 'card') {
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  }
}
/* Scroll the horizontal tab bar by hand: scrollIntoView() would move Chrome's
   sequential-focus starting point past the skip link and the tabs. */
function keepTabInView() {
  const list = $('#tabs'), t = $('#tab-' + state.route);
  if (!list || !t) return;
  const left = t.offsetLeft - list.offsetLeft, right = left + t.offsetWidth;
  if (left < list.scrollLeft) list.scrollLeft = left - 12;
  else if (right > list.scrollLeft + list.clientWidth) list.scrollLeft = right - list.clientWidth + 12;
}
let pendingFocus = null;
function go(route, focus) {
  pendingFocus = focus || null;
  if (location.hash === '#' + route) { render({ focus: pendingFocus }); pendingFocus = null; }
  else location.hash = route;
}
window.addEventListener('hashchange', () => { render({ focus: pendingFocus }); pendingFocus = null; });

/* ================= Events ================= */
document.addEventListener('click', e => {
  const tab = e.target.closest('[role="tab"]');
  if (tab) { go(tab.dataset.route, 'tab'); return; }

  const el = e.target.closest('[data-action]');
  if (!el) {
    const row = e.target.closest('tr[data-row]');
    if (row) openFinding(row.dataset.row);
    return;
  }
  if (el.tagName === 'SELECT' || el.tagName === 'INPUT') return;   // handled on change
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, e);
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = CHANGES[el.dataset.action];
  if (fn) fn(el, e);
});

/* <details> toggle does not bubble, so listen in the capture phase. */
document.addEventListener('toggle', e => {
  if (e.target.id === 'grp-other') state.otherOpen = e.target.open;
}, true);

$('#scrim').addEventListener('click', () => closeDrawer());

document.addEventListener('keydown', e => {
  const d = $('#drawer');
  if (!d.hidden) {
    if (e.key === 'Escape') { e.preventDefault(); closeDrawer(); return; }
    if (e.key === 'Tab') {                         // keep focus inside the dialog
      const f = $$('button, [href], input, textarea, select, summary, [tabindex]:not([tabindex="-1"])', d).filter(x => !x.disabled);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if (tab) {
    const ids = DATA.routes.map(r => r.id);
    let i = ids.indexOf(tab.dataset.route);
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') i = (i + 1) % ids.length;
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') i = (i - 1 + ids.length) % ids.length;
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = ids.length - 1;
    else return;
    e.preventDefault();
    go(ids[i], 'tab');
    return;
  }
  const row = e.target.closest && e.target.closest('tr[data-row]');
  if (row && e.key === 'Enter' && e.target === row) openFinding(row.dataset.row);
});

/* Tab orientation follows the layout: vertical rail or horizontal bar */
const syncOrientation = () => $('#tabs').setAttribute('aria-orientation', narrow.matches ? 'horizontal' : 'vertical');
narrow.addEventListener ? narrow.addEventListener('change', syncOrientation) : narrow.addListener(syncOrientation);

/* ================= Boot ================= */
syncOrientation();
renderHeader();
render();
})();
</script>
</body>
</html>
