<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Due diligence workspace · UX mockup v2</title>
<link rel="icon" href="data:,">
<style>
/* ===== Tokens ===== */
:root{
  --paper:#EEF1F4;          /* dossier paper: page background */
  --sheet:#FBFCFD;          /* sheet: cards, surfaces */
  --ink:#172233;            /* blue-black ink: primary text, signed content */
  --graphite:#5D6571;       /* pencil graphite: agent-authored + secondary text */
  --sig:#2443C4;            /* signature blue: human actions, focus, initials */
  --sig-hover:#1D37A3;
  --hl:#F3D34A;             /* highlighter: background only */
  --hl-bg:rgba(243,211,74,.36);
  --red:#C2362B;            /* redline */
  --red-bg:rgba(194,54,43,.06);
  --line:rgba(23,34,51,.12);
  --ink-wash:rgba(23,34,51,.05);
  --r:4px;
  --f-display:'Iowan Old Style','Charter','Sitka Text',Georgia,serif;
  --f-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --f-data:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --f-sig:'Snell Roundhand','Segoe Script','Bradley Hand',cursive;
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-data);font-size:12px}
.nowrap{white-space:nowrap}
.pencil{color:var(--graphite)}
.ink{color:var(--ink)}
.caps{font-variant-caps:all-small-caps;letter-spacing:.1em;font-weight:600;color:var(--graphite);font-size:14px;line-height:1.2}
.ic{width:14px;height:14px;flex:none;vertical-align:-2px}

.skip{position:absolute;left:8px;top:-48px;z-index:50;background:var(--sig);color:#fff;border:0;border-radius:var(--r);padding:8px 12px}
.skip:focus{top:8px}

/* ===== Banner + document-control header ===== */
.banner{background:var(--ink);color:var(--sheet);font-size:12px;text-align:center;padding:4px 12px;letter-spacing:.02em}
.docbar{background:var(--sheet);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 28px}
.product{display:flex;flex-direction:column;line-height:1.2}
.product b{font-family:var(--f-display);font-weight:400;font-size:16px}
.product span{font-size:12px;color:var(--graphite)}
.doc-control{flex:1 1 460px;font:12px/1.6 var(--f-data);color:var(--ink)}
.doc-control .sep{color:var(--graphite);padding:0 .45em}
.doc-control .due{background:var(--hl-bg);padding:0 3px;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .lg-pencil{color:var(--graphite)}
.legend .lg-ink{color:var(--ink)}
.legend .lg-ink i{font-family:var(--f-sig);font-style:normal;color:var(--sig);font-size:16px;line-height:1}

/* ===== Shell: binder rail + main ===== */
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 92px)}
.rail{padding:28px 0 24px 16px}
.tablist{display:flex;flex-direction:column;gap:4px;position:sticky;top:20px}
.tab{display:flex;align-items:baseline;gap:10px;text-align:left;background:transparent;border:1px solid transparent;border-right:0;border-radius:var(--r) 0 0 var(--r);margin-right:-1px;padding:9px 12px;color:var(--graphite);font-size:14px;position:relative}
.tab:hover{color:var(--ink);background:rgba(251,252,253,.55)}
.tab[aria-selected="true"]{background:var(--sheet);border-color:var(--line);color:var(--ink);font-weight:600;z-index:1}
.tab .n{font:12px var(--f-data);min-width:1.1em}
.tab.arch{margin-top:18px}
.tab.arch::before{content:"";position:absolute;left:12px;right:12px;top:-11px;border-top:1px solid var(--line)}
.main{border-left:1px solid var(--line);padding:28px 32px 72px;min-width:0}
.main:focus{outline:none}

/* ===== Screen scaffolding ===== */
.screen-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin-bottom:20px}
.screen-head h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.2}
.screen-head h1:focus{outline:none}
.lede{color:var(--graphite);margin-top:4px;max-width:70ch;font-size:14px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.sheet > h2,.panel-h{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel-h:focus{outline:none}
.sheet > h2 small,.panel-h small{font-weight:400;font-size:12px;color:var(--graphite)}
.note{font-size:12px;color:var(--graphite);margin-top:10px}
.stack{display:grid;gap:20px;align-content:start}
.grid-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:var(--r);padding:2px 8px;color:var(--graphite);background:var(--sheet);white-space:nowrap}
.tag.proposal{border-style:dashed;border-color:var(--graphite)}

/* ===== Controls ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:8px 14px;font-size:14px;font-weight:600;border:1px solid var(--sig);background:var(--sheet);color:var(--sig);white-space:nowrap}
.btn:hover{background:rgba(36,67,196,.06)}
.btn-primary{background:var(--sig);color:#fff}
.btn-primary:hover{background:var(--sig-hover)}
.btn-quiet{border-color:var(--line);color:var(--ink);font-weight:500}
.btn-quiet:hover{background:var(--ink-wash)}
.btn-sm{padding:3px 10px;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:4px 10px;font-size:12px;background:var(--sheet);color:var(--ink)}
.chip:hover{border-color:rgba(23,34,51,.35)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink-wash);font-weight:600}
.chip .ic{display:none;width:12px;height:12px}
.chip[aria-pressed="true"] .ic{display:inline}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.field{display:grid;gap:4px;align-content:start}
.field.full{grid-column:1/-1}
.field > label,.field > .flabel{font-size:12px;color:var(--graphite);font-weight:600}
.input{width:100%;border:1px solid rgba(23,34,51,.22);border-radius:var(--r);background:#fff;padding:7px 10px;font-size:14px;min-height:36px}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}

.seg{display:inline-flex;border:1px solid rgba(23,34,51,.22);border-radius:var(--r);padding:2px;background:#fff}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:6px 16px;border-radius:3px;font-size:14px;color:var(--graphite);cursor:pointer}
.seg input:checked + label{background:var(--ink);color:var(--sheet);font-weight:600}
.seg input:focus-visible + label{outline:2px solid var(--sig);outline-offset:2px}

/* ===== Request ===== */
.questions li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.questions li:first-child{border-top:0}
.questions .qn{font:12px/1.9 var(--f-data);color:var(--graphite)}
.qsub{display:block;font-size:12px;color:var(--graphite)}
.roles li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.roles li:first-child{border-top:0}
.cleared{display:inline-flex;align-items:center;gap:4px;font:12px var(--f-data);color:var(--ink);white-space:nowrap}
.outscope{font-size:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.outscope b{font-weight:600}
.request-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}

/* ===== Team ===== */
.people{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--sheet)}
.person .caps{display:block;margin-bottom:4px}
.person b{display:block;font-size:14px}
.person p{font-size:12px;color:var(--graphite);margin-top:4px}
.ladder{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px}
.ladder .rung{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:3px 8px;background:var(--sheet)}
.ladder .rung.above{border-style:dashed;color:var(--graphite)}
.ladder .ceiling{font:12px var(--f-data);color:var(--ink);border-left:2px solid var(--ink);padding-left:8px}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.agent{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);padding:14px 16px}
.agent-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.agent h3{font-size:16px;font-weight:600}
.agent .desc{font-size:14px}
.kv{display:grid;grid-template-columns:minmax(0,1fr);gap:2px 0;font-size:14px}
.kv dt{font-size:12px;color:var(--graphite);font-weight:600;margin-top:6px}
.srcs{display:flex;flex-wrap:wrap;gap:4px}
.srcs li{font:12px var(--f-data);border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--ink)}
.guard{font-size:14px;border-left:2px solid var(--ink);padding-left:10px}
.agent-status{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:12px;display:flex;gap:6px;align-items:center}
.agent-status.wait{background:var(--hl-bg);color:var(--ink);margin:auto -16px -14px;padding:8px 16px;border-radius:0 0 var(--r) var(--r)}
.badge{display:inline-flex;align-items:center;gap:6px;font:12px var(--f-data);border:1px solid var(--line);border-radius:3px;padding:1px 6px;white-space:nowrap}
.meter{display:inline-flex;gap:2px}
.meter i{width:5px;height:10px;border:1px solid var(--ink);border-radius:1px}
.meter i.on{background:var(--ink)}
.meter i.off{border-color:rgba(23,34,51,.25)}

/* ===== Run ===== */
.stepper{display:grid;grid-template-columns:repeat(8,minmax(88px,1fr));gap:0;overflow-x:auto;counter-reset:s}
.step{position:relative;padding:8px 8px 4px;font-size:14px;color:var(--graphite);border-top:3px solid var(--line)}
.step .mono{display:block;color:var(--graphite)}
.step.done{border-top-color:var(--ink);color:var(--ink)}
.step.current{border-top-color:var(--ink);color:var(--ink);font-weight:600;background:var(--hl-bg)}
.step .state{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:400}
.run-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:20px}
.lanes{display:grid}
.lane{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(120px,.9fr) minmax(0,2fr) auto;gap:6px 16px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.lane:first-of-type{border-top:0}
.lane.head{font-size:12px;color:var(--graphite);font-weight:600;padding:0 0 8px}
.lane .name b{display:block;font-weight:600}
.lane .name span{font-size:12px;color:var(--graphite)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--graphite)}
.lane .act{display:flex;gap:6px;align-items:flex-start}
.lane .act .ic{margin-top:3px}
.lane .count{font:12px var(--f-data);text-align:right;white-space:nowrap}
.queue{display:grid;gap:8px}
.queue li{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--hl-bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px}
.queue .owner{display:block;font-size:12px;color:var(--ink)}
.feed li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.feed time{font:12px/1.9 var(--f-data);color:var(--graphite)}
.feed .actor{font-weight:600}
.feed .person-entry{color:var(--ink)}
.feed .agent-entry{color:var(--graphite)}
.ref{font:12px var(--f-data);color:var(--sig);background:none;border:0;padding:0 1px;text-decoration:underline;text-underline-offset:2px}
.ref:hover{text-decoration-thickness:2px}

/* ===== Sign-off strip (signature element) ===== */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);min-width:0}
.cell{display:flex;flex-direction:column;gap:3px;padding:8px;min-width:0;min-height:62px}
.cell + .cell{border-left:1px solid var(--line)}
.cell .caps{font-size:12px;line-height:1.1;letter-spacing:.06em}
.cell .who{display:flex;gap:5px;align-items:flex-start;font-size:14px;line-height:1.3;overflow-wrap:break-word;min-width:0}
.cell .who .ic{margin-top:2px}
.cell .sub{font-size:12px;line-height:1.35;color:var(--graphite);overflow-wrap:break-word}
.cell-prep .who{color:var(--graphite)}
.cell-chal .who{color:var(--graphite)}
.cell-chal.is-open{background:var(--hl-bg)}
.cell-chal.is-open .who,.cell-chal.is-open .sub{color:var(--ink)}
.cell-chal.is-returned .who{color:var(--red)}
.cell-appr .await{border:1px dotted var(--graphite);border-radius:3px;padding:4px 6px;font-size:12px;color:var(--graphite);line-height:1.3}
.cell-appr .await-row{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.cell-appr.is-signed .role{font-size:12px;color:var(--ink);line-height:1.2}
.cell-appr.is-signed:focus{outline:2px solid var(--sig);outline-offset:-2px}
.cell-appr.is-rejected .who{color:var(--red)}
.sig{font-family:var(--f-sig);color:var(--sig);font-size:28px;line-height:1.05;display:inline-block;white-space:nowrap;padding-right:4px}
.sig.anim{animation:ink-draw 600ms cubic-bezier(.55,0,.35,1) both}
@keyframes ink-draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.when{font:12px var(--f-data);color:var(--graphite)}
.strip.compact .cell{padding:5px 7px;min-height:0;gap:2px}
.strip.compact .cell .who{font-size:12px}
.strip.compact .cell .caps{font-variant-caps:normal;letter-spacing:0;font-size:11px}

.strip.compact .sig{font-size:20px}
.strip.compact .await{padding:2px 5px}

/* ===== Findings ===== */
.findings-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}
.filters{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;margin-bottom:14px}
.filter-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filter-group > .caps{margin-right:4px}
.result-line{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--graphite);margin-bottom:8px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
table.ft{width:100%;min-width:1120px;border-collapse:collapse;font-size:14px;table-layout:fixed}
.ft .src{overflow-wrap:break-word}
.ft td.small{font-size:12px;line-height:1.45}
.ft th{text-align:left;font-size:12px;font-weight:600;color:var(--graphite);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sheet)}
.ft td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ft tr:last-child td{border-bottom:0}
.ft tbody tr{cursor:pointer}
.ft tbody tr:hover td{background:rgba(23,34,51,.025)}
.ft .src{display:block;font-size:12px;line-height:1.45}
.ft .nosrc{color:var(--red);font-weight:600}
.id-btn{font:600 12px var(--f-data);color:var(--sig);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px}
tr.is-rejected td{background:var(--red-bg)}
tr.is-rejected .claim-text{color:var(--red);text-decoration:line-through;text-decoration-thickness:1px}
.reject-note{display:block;color:var(--red);font-size:12px;font-weight:600;margin-top:4px;text-decoration:none}
.status{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 7px;border-radius:3px;border:1px solid var(--line);white-space:nowrap;line-height:1.6}
.st-verified{border-color:var(--ink);color:var(--ink)}
.st-draft{border:1px dashed var(--graphite);color:var(--graphite)}
.st-challenged{background:var(--hl-bg);color:var(--ink);border-color:rgba(23,34,51,.2)}
.st-rejected{color:var(--red);border-color:var(--red)}
.st-heor{color:var(--graphite);border-color:var(--graphite)}
.conf{font:12px var(--f-data)}
.empty{padding:24px;text-align:center;color:var(--graphite);font-size:14px}
.checklist h3{font-size:12px;color:var(--graphite);font-weight:600;margin:14px 0 4px}
.checklist .ck-group:first-child h3{margin-top:0}
.checklist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.ck{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;padding:1px 6px;border-radius:3px}
.ck-checked{color:var(--ink)}
.ck-na{color:var(--ink)}
.ck-open{background:var(--hl-bg);color:var(--ink)}
.ck-heor{color:var(--graphite);border:1px solid var(--graphite)}

/* ===== Drawer ===== */
.scrim{position:fixed;inset:0;background:rgba(23,34,51,.32);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--sheet);border-left:1px solid var(--line);z-index:30;overflow-y:auto;padding:20px 24px 40px;animation:slidein 180ms ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.drawer-head h2{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.3}
.drawer-head h2 .mono{display:block;font-size:12px;color:var(--graphite)}
.record{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;font-size:14px;margin:16px 0 20px}
.record dt{font-size:12px;color:var(--graphite);font-weight:600;padding-top:2px}
.drawer h3{font-size:14px;font-weight:600;margin:20px 0 8px}
.thread li{border-left:2px solid var(--line);padding:4px 0 10px 12px;font-size:14px}
.thread li.t-red{border-left-color:var(--graphite)}
.thread li.t-open{border-left-color:var(--hl)}
.thread .meta{display:flex;gap:8px;align-items:baseline;font-size:12px}
.thread .meta b{font-weight:600}
.thread .t-agent{color:var(--graphite)}
.thread .t-person{color:var(--ink)}

/* ===== Briefing ===== */
.brief-grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
.doc{background:var(--sheet);border:1px solid var(--line);border-radius:2px;padding:44px 56px 52px;max-width:820px;width:100%;justify-self:center}
.doc-ctl{display:grid;grid-template-columns:repeat(4,minmax(0,auto));border:1px solid var(--line);font:12px/1.4 var(--f-data);margin-bottom:28px}
.doc-ctl div{padding:6px 10px;min-width:0}
.doc-ctl div + div{border-left:1px solid var(--line)}
.doc-ctl span{display:block;color:var(--graphite)}
.doc h1{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1.1;margin-bottom:6px}
.doc .doc-sub{color:var(--graphite);font-size:14px;margin-bottom:20px}
.doc-notice{border-left:3px solid var(--ink);background:var(--ink-wash);padding:10px 14px;font-size:14px;color:var(--ink)}
.doc-draftnote{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--graphite);margin-top:10px}
.doc h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:30px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.stmts li{position:relative;padding:4px 0 4px 18px;font-size:15px;color:var(--graphite)}
.stmts li::before{content:"";position:absolute;left:2px;top:14px;width:6px;height:1px;background:var(--graphite)}
.ptrs{width:100%;border-collapse:collapse;font-size:14px}
.ptrs th,.ptrs td{text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ptrs th{font-size:12px;color:var(--graphite);font-weight:600}
.ptrs td{color:var(--graphite)}
.ptrs td:first-child{color:var(--ink)}
.excluded{margin-top:24px;font-size:12px;color:var(--red);border-top:1px solid var(--line);padding-top:12px}
.decision{border-top:1px solid var(--line);padding:16px 0}
.decision:first-of-type{border-top:0;padding-top:0}
.decision h3{font-size:16px;font-weight:600}
.decision .owner{font-size:12px;color:var(--graphite);margin:2px 0 8px}
.decision .owner b{color:var(--ink);font-weight:600}
.decision-body{font-size:14px;margin-bottom:10px;transition:color 300ms}
.decision-body.pencil{display:flex;gap:6px}
.dec-count{font:12px var(--f-data);color:var(--ink)}

/* ===== Architecture ===== */
.arch-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
.frame{position:relative;border:2px solid var(--ink);border-radius:var(--r);padding:20px 18px 18px;background:var(--sheet)}
.frame-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.frame-head b{font-family:var(--f-display);font-weight:600;font-size:16px;margin-right:4px}
.role-chip{font-size:12px;border:1px solid var(--ink);border-radius:3px;padding:1px 8px;color:var(--ink)}
.layers{display:grid;gap:8px}
.layer{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;align-items:start;text-align:left;width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);padding:12px 14px}
.layer:hover{border-color:rgba(23,34,51,.35)}
.layer[aria-pressed="true"]{border-color:var(--ink);background:var(--ink-wash)}
.layer .ln{font:12px/1.7 var(--f-data);color:var(--graphite)}
.layer .lt{font-size:16px;font-weight:600}
.layer .ls{grid-column:2/3;font-size:12px;color:var(--graphite)}
.layer .lchips{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.layer .lchips span{font-size:12px;border:1px solid var(--line);border-radius:3px;padding:0 6px;background:var(--sheet)}
.layer .lchips span.mvp{border-color:var(--ink);font-weight:600}
.layer .lchips span.concept{border-style:dashed;color:var(--graphite)}
.layer.foundation{border-bottom-width:3px}
.layer .chev{font-size:12px;color:var(--graphite);white-space:nowrap}
.up-note{font-size:12px;color:var(--graphite);margin-top:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.detail dl{display:grid;gap:4px;font-size:14px}
.detail dt{font-size:12px;color:var(--graphite);font-weight:600;margin-top:10px}
.detail dt:first-child{margin-top:0}
.detail ul.dots li{position:relative;padding-left:14px}
.detail ul.dots li::before{content:"";position:absolute;left:2px;top:11px;width:5px;height:1px;background:var(--ink)}
.callout{border-left:2px solid var(--ink);padding:2px 0 2px 12px;font-size:14px}
.callout b{display:block;font-weight:600;margin-bottom:2px}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:var(--r);font-size:14px;opacity:0;pointer-events:none;transition:opacity 160ms,transform 160ms;z-index:40;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== v2: shared pieces ===== */
.sheet > h2 > span,.panel-h > span{display:inline-flex;align-items:baseline;gap:6px}
.sub-h{font-size:12px;font-weight:600;color:var(--graphite);margin:14px 0 2px}
.sub-h:first-of-type{margin-top:0}
.legend .lg-redact{color:var(--ink)}
.redact-swatch{display:inline-block;width:22px;height:10px;background:var(--ink);border-radius:1px}
.tier-tag{display:inline-block;font:11px/1.5 var(--f-data);border:1px solid var(--line);border-radius:3px;padding:0 5px;white-space:nowrap;color:var(--ink);vertical-align:1px}
.tier-public{border-color:var(--line)}
.tier-vdr{border-color:var(--sig);color:var(--sig)}
.tier-response{border:1px dashed var(--sig);color:var(--sig)}
.type{display:inline-block;font-size:12px;line-height:1.35;padding:1px 6px;border-radius:3px;border:1px solid var(--line)}
.ty-finding{border-color:var(--ink)}
.ty-risk{border-color:var(--red);color:var(--red)}
.ty-gap{border:1px dashed var(--ink)}
.ty-unk{background:var(--hl-bg);border-color:rgba(23,34,51,.2)}

/* ===== v2: Request ===== */
.late-note{border-left:3px solid var(--sig);background:rgba(36,67,196,.05);padding:8px 12px;font-size:13px;margin-top:14px}
.lockline{display:flex;gap:8px;align-items:flex-start;font-size:13px;border:1px solid var(--ink);border-radius:var(--r);padding:8px 10px;margin-top:14px}
.lockline .ic{margin-top:2px}
.tiers{display:grid;gap:16px}
.tier h3{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.tier > p{font-size:12px;color:var(--graphite)}
.docs li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.docs li:first-child{margin-top:6px}
.docs .mono{color:var(--graphite);margin-right:6px}
.rel{font-size:12px;border:1px solid rgba(23,34,51,.22);border-radius:var(--r);padding:3px 6px;background:#fff;min-height:28px}
.rel.r-yes{border-color:var(--sig);color:var(--sig)}
.rel.r-undecided{background:var(--hl-bg)}
.locked{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--graphite);white-space:nowrap}

/* ===== v2: Regulatory team ===== */
.team-sum{font-size:14px;margin:4px 0 20px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
.group{margin-bottom:28px}
.group-note{margin:-6px 0 12px}
details.group > summary{cursor:pointer;list-style:none;display:grid;gap:2px;padding:12px 14px;border:1px dashed var(--graphite);border-radius:var(--r);margin-bottom:12px}
details.group > summary::-webkit-details-marker{display:none}
details.group > summary .panel-h{margin:0}
details.group > summary .note{margin:0}
details.group > summary .more{font-size:12px;color:var(--sig);font-weight:600}
.agent-top .left{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.agent.off{background:transparent;border-style:dashed}
.agent.off h3,.agent.off .desc{color:var(--graphite)}
.trig{font-size:12px;color:var(--graphite)}
.spec summary{font-size:12px;color:var(--sig);cursor:pointer;font-weight:600}
.spec[open] summary{margin-bottom:4px}
.switch{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:2px 0;font-size:12px;color:var(--ink);white-space:nowrap}
.switch .track{width:30px;height:18px;border-radius:9px;background:rgba(23,34,51,.28);position:relative;flex:none;transition:background 150ms}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform 150ms}
.switch[aria-checked="true"] .track{background:var(--sig)}
.switch[aria-checked="true"] .track::after{transform:translateX(12px)}
.switch:disabled{cursor:default;color:var(--graphite)}
.switch:disabled .track{opacity:.55}

/* ===== v2: Run board ===== */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;align-items:start;padding-bottom:4px}
.col{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:600}
.col-h .mono{color:var(--graphite)}
.col-note{font-size:12px;color:var(--graphite);margin:2px 0 10px}
.cards{display:grid;gap:8px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px;font-size:13px;min-width:0}
.card:focus{outline:2px solid var(--sig);outline-offset:1px}
.card .cid{display:flex;justify-content:space-between;gap:6px;font:12px var(--f-data);color:var(--graphite)}
.card h3{font-size:13px;font-weight:600;line-height:1.35}
.card .by{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--graphite)}
.card .flag{font-size:12px;line-height:1.35;background:var(--hl-bg);border-radius:3px;padding:2px 6px;color:var(--ink)}
.card .flag.wait{background:transparent;border:1px dashed var(--graphite)}
.card .flag.ok{background:transparent;border:1px solid var(--sig);color:var(--sig)}
.card.signed{border-color:rgba(23,34,51,.3)}
.card .signed-by{display:flex;align-items:baseline;gap:8px}
.card .signed-by .sig{font-size:20px}
.card-actions{display:flex;flex-wrap:wrap;gap:6px}
.col-empty{font-size:12px;color:var(--graphite);padding:4px 2px}
.under-board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.queue .q-empty{background:none;border-style:dashed;color:var(--graphite)}
.feed .ext-entry,.feed .rev-entry{color:var(--ink)}
.feed .ext-entry .actor,.feed .rev-entry .actor{font-style:italic}

/* ===== v2: Findings and risks ===== */
/* Fits the 1173px table area at a 1440px window; the sign-off strip sits 2 x 2 (css-findings.css). */
table.ft{min-width:1150px}
.ft .src + .src{margin-top:4px}
.strip.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.cell-exp .who{color:var(--graphite)}
.cell-exp.is-open{background:var(--hl-bg)}
.cell-exp.is-open .who{color:var(--ink)}
.cell-exp.is-back .who{color:var(--sig)}
.type-note{display:block;font-size:12px;color:var(--graphite);margin-top:2px}
.ck-cannot{background:var(--hl-bg);color:var(--ink);border:1px dashed var(--ink)}
.ck-notchecked{color:var(--graphite);border:1px dotted var(--graphite)}
.ck-note{display:block;font-size:12px;color:var(--graphite)}

/* ===== v2: Expert review and redaction ===== */
.san-box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;font-size:14px}
.san-box h3,.san-box h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--graphite)}
.san-out{background:var(--paper)}
.redact{display:inline-block;width:5.5em;height:1em;background:var(--ink);border-radius:1px;vertical-align:-2px}
.gen{border-bottom:1.5px dashed var(--ink)}
.will-redact{box-shadow:inset 0 -2px 0 var(--ink);background:var(--ink-wash)}
.will-gen{box-shadow:inset 0 -2px 0 var(--hl);background:var(--hl-bg)}
.san-key{display:flex;gap:12px;font-size:12px;margin-top:8px}
.checks li{display:flex;gap:6px;align-items:flex-start;font-size:13px;padding:3px 0}
.checks .ic{margin-top:2px}
.confirm{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:16px 0 4px;padding:10px 12px;background:var(--hl-bg);border-radius:var(--r);cursor:pointer}
.confirm input{margin-top:3px;width:16px;height:16px;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.expert-view{border-left:3px solid var(--sig);background:rgba(36,67,196,.05);padding:8px 12px;font-size:14px;margin:10px 0 4px}
.expert-view b{font-weight:600}
.advice{font-size:12px;color:var(--graphite)}
.recheck{font-size:12px;background:var(--hl-bg);padding:6px 10px;border-radius:var(--r);margin-top:-8px;margin-bottom:12px}

/* ===== v2: Licensor requests ===== */
.req-sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.req-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.req{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.req + .req{margin-top:12px}
.req:focus{outline:2px solid var(--sig);outline-offset:2px}
.req-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.req-h{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.req-q{font-size:15px;margin:6px 0 10px}
.rstat{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 7px;border-radius:3px;border:1px solid var(--line);white-space:nowrap;line-height:1.6}
.rs-draft{border:1px dashed var(--graphite);color:var(--graphite)}
.rs-sent{background:var(--hl-bg);color:var(--ink);border-color:rgba(23,34,51,.2)}
.rs-answered{border-color:var(--ink);color:var(--ink)}
.rs-declined{border-color:var(--red);color:var(--red)}
.rs-absent{border:1px dashed var(--red);color:var(--red)}
.rs-silent{border:1px dotted var(--graphite);color:var(--graphite)}
.trail{border-top:1px solid var(--line)}
.trail li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.trail li:last-child{border-bottom:0}
.trail .tm{font:12px var(--f-data);color:var(--graphite)}
.trail .t-agent{color:var(--graphite)}
.trail .t-person,.trail .t-ext{color:var(--ink)}
.trail .await{border:1px dotted var(--graphite);border-radius:3px;padding:2px 6px;font-size:12px;color:var(--graphite);margin-right:6px}
.quote{display:block;font-style:italic;color:var(--graphite);margin-top:2px}
.np{display:grid;gap:4px;font-size:13px}
.np dd{color:var(--graphite);margin-bottom:8px}
.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{box-shadow:0 0 0 4px var(--hl)}to{box-shadow:0 0 0 4px transparent}}

/* ===== v2: Architecture ===== */
.cm{display:grid;gap:8px;font-size:13px}
.cm-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cm-box{border:1px solid var(--ink);border-radius:var(--r);padding:6px 10px;background:var(--sheet);font-weight:600}
.cm-box small{display:block;font-weight:400;font-size:12px;color:var(--graphite)}
.cm-box.out{border-style:dashed}
.cm-arrow{color:var(--graphite);font-family:var(--f-data)}
.cm-chan{border-left:2px dashed var(--graphite);margin-left:14px;padding:2px 0 2px 12px;color:var(--graphite);font-size:12px}

/* ===== frag-briefing.js: Architecture, confidentiality model ===== */
/* Keep "lead ⇄ agents" on one line at every width (the boxes wrap their own text instead):
   wrapped, the arrow pointed at nothing. At 13px the arrow was about 8px wide, so enlarge it. */
.cm-row{flex-wrap:nowrap}
.cm-row > .cm-box{flex:0 1 auto;min-width:0}
.cm-arrow{flex:none;font-size:20px;line-height:1}
/* ===== v2: frag-findings (record and redaction drawers) ===== */
.drawer .strip + .recheck{margin-top:12px}
.drawer .nosrc{color:var(--red);font-weight:600}
.fnd-rej{color:var(--red)}
.fnd-srcs li + li{margin-top:4px}
.fnd-say{font-size:14px;margin-bottom:8px}
.fnd-lede{margin:0 0 14px}
.fnd-field{margin-top:16px}
.fnd-actions{margin-top:16px}
/* The table's four-cell sign-off strip sits 2 x 2, as it does on narrow screens. In one row each
   cell had about 66px, too narrow for agent names such as "Regulatory lead", and the 332px column
   it needed kept the table from fitting a 1440px window. */
.ft .strip.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.ft .strip.four .cell:nth-child(3){border-left:0}
.ft .strip.four .cell:nth-child(n+3){border-top:1px solid var(--line)}
/* Card layout (narrow screens): every strip fills its card. "td > *{justify-self:start}" sized each
   strip to its own text, so strips differed in width from card to card. */
@media (max-width:700px){
  .ft td.c-strip > .strip{justify-self:stretch}
}
/* Next to the 290px checklist the table would get too narrow for its claims, so the checklist
   drops below the table up to 1820px (v1 did this at 1640px, for a narrower table). */
@media (max-width:1820px){
  .findings-grid{grid-template-columns:minmax(0,1fr)}
  .checklist .ck-groups{columns:3 260px;column-gap:28px}
  .checklist .ck-group{break-inside:avoid}
}
/* ===== v2: frag-request.js ===== */
/* Access rows ("Clinical regulatory expert" + "Cleared · not read in"): between 901 and 1100px the
   right-hand column is under 300px, too narrow for the role and its nowrap mark side by side, so
   the sheets stuck out of their column. There the mark drops under the role instead. */
@media (min-width:901px) and (max-width:1100px){
  .roles li{flex-wrap:wrap;row-gap:2px}
}
/* ===== v2: frag-run.js (Run board) ===== */
/* Contain the cards' visually hidden text: positioned against the page, the spans in columns
   scrolled out of view made the whole page scroll sideways below about 1440px. */
.board{position:relative}
/* Space between the workflow and the board. The sheets sit directly in main, not in a .stack:
   a .stack track would grow to the board's minimum width instead of letting the board scroll. */
.run-acts{margin-top:20px}
/* The "why it cannot be signed yet" line inside a card: .col-note look, without its column margins. */
.card .col-note{margin:0}
/* Signed card: when the card is narrow, "RA DD lead · 09:52" drops under the initials in one piece
   instead of breaking after the dot. */
.card .signed-by{flex-wrap:wrap;row-gap:0}
.card .signed-by .when{white-space:nowrap}

/* ===== v2: frag-team.js ===== */
/* The "Show" / "Hide" hint on the collapsed "Other functions" group follows the native open state. */
details.group:not([open]) > summary .team-hide,
details.group[open] > summary .team-show{display:none}
/* Agent card top: the group tag and the switch share the first row; the autonomy badge takes
   the second row, so a long badge never pushes the switch out of a narrow card. */
.agent .agent-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 8px}
.agent .agent-top .left{display:contents}
.agent .agent-top .tag{grid-column:1;grid-row:1;justify-self:start}
.agent .agent-top .badge{grid-column:1 / -1;grid-row:2;justify-self:start}
.agent .agent-top .switch{grid-column:2;grid-row:1}
/* ===== Responsive ===== */
@media (max-width:1640px){
  .findings-grid{grid-template-columns:minmax(0,1fr)}
  .checklist .ck-groups{columns:3 260px;column-gap:28px}
  .checklist .ck-group{break-inside:avoid}
}
@media (max-width:1240px){
  .brief-grid{grid-template-columns:minmax(0,1fr)}
  .doc{justify-self:stretch;max-width:none}
}
@media (max-width:1100px){
  .run-grid{grid-template-columns:minmax(0,1fr)}
  .people{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{padding:0;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .tablist{flex-direction:row;position:static;overflow-x:auto;padding:8px 12px 0;gap:2px;scrollbar-width:none}
  .tab{border:1px solid transparent;border-bottom:0;border-radius:var(--r) var(--r) 0 0;margin:0 0 -1px;white-space:nowrap;padding:8px 12px}
  .tab.arch{margin-top:0;margin-left:14px}
  .tab.arch::before{left:-8px;right:auto;top:8px;bottom:8px;border-top:0;border-left:1px solid var(--line)}
  .main{border-left:0;padding:20px 16px 72px}
  .grid-2,.arch-grid{grid-template-columns:minmax(0,1fr)}
  .docbar{padding:8px 16px}
  .lane{grid-template-columns:minmax(0,1fr) auto}
  .lane .prog{grid-column:1/-1}
  .lane .act{grid-column:1/-1}
  .lane.head{display:none}
  .lane.head + .lane{border-top:0}
  html{scroll-padding-top:56px}
  .lane .count{grid-row:1;grid-column:2}
}
@media (max-width:700px){
  table.ft{min-width:0}
  .table-wrap{border:0;background:none}
  .ft thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .ft,.ft tbody,.ft tr,.ft td{display:block}
  .ft tbody tr{border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);margin-bottom:12px;padding:10px 12px}
  .ft td{border:0;padding:4px 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;width:auto!important}
  .ft td::before{content:attr(data-label);font-size:12px;color:var(--graphite);font-weight:600}
  .ft td > *{justify-self:start;min-width:0}
  .ft td.c-strip{display:block;padding-top:8px}
  .ft td.c-strip::before{display:none}
  tr.is-rejected{background:var(--red-bg)!important}
  .fields{grid-template-columns:minmax(0,1fr)}
  .stepper{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:10px}
  .people{grid-template-columns:minmax(0,1fr)}
  .doc{padding:24px 18px 32px}
  .doc h1{font-size:28px}
  .doc-ctl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .doc-ctl div:nth-child(3){border-left:0}
  .doc-ctl div:nth-child(n+3){border-top:1px solid var(--line)}

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s).replace(/[&<>"']/g, c => ESC[c]);
const nowHHMM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

const findingById = id => DATA.findings.find(f => f.id === id);

/* Effective values: data as loaded, overridden by what a person did in this session. */
const expertOf = f => state.expert[f.id] || f.expert;
const approvalOf = f => state.findSigned[f.id]
  ? { state: 'signed', role: LEAD, initials: LEAD_INITIALS, when: state.findSigned[f.id] }
  : Object.assign({ role: LEAD }, f.approval);
const statusOf = f => (state.findSigned[f.id] && f.status !== 'Flagged to HEOR') ? 'Verified' : f.status;
const reqStatus = r => (state.req[r.id] && state.req[r.id].status) || r.status;
const reqSentAt = r => (state.req[r.id] && state.req[r.id].t) || r.sent || '';
const actColOf = a => state.actCol[a.id] || a.col;
const actSignedAt = a => state.actSigned[a.id] || a.signed || '';

/* Why a finding cannot be signed right now; '' means it can be signed; 'done' means signed, rejected or not awaiting. */
function signBlock(f) {
  if (state.findSigned[f.id] || f.approval.state !== 'awaiting') return 'done';
  if (f.challenge.state === 'open') return 'Sign after the red-team challenge closes';
  const ex = expertOf(f);
  if (ex.state === 'drafted') return 'Approve or drop the sanitised question first';
  if (ex.state === 'sent') return 'Waiting for the expert view';
  return '';
}

/* References: F-xx opens the finding drawer, R-xx opens the licensor request. */

  ? `<button type="button" class="ref" data-action="open-request" data-id="${esc(id)}" aria-label="Open licensor request ${esc(id)}">${esc(id)}</button>`

const refs = list => list.map(refBtn).join(', ');
const linkify = text => esc(text).replace(/\b[FR]-\d{2}\b/g, m => refBtn(m));

const head = (title, lede, right) =>
  `<div class="screen-head"><div><h1 tabindex="-1" id="screenTitle">${title}</h1>${lede ? `<p class="lede">${lede}</p>` : ''}</div>${right || ''}</div>`;

const statusChip = s => {

  const ic = { 'Verified': ICON.check, 'Rejected': ICON.cross, 'Flagged to HEOR': ICON.arrow, 'Challenged': ICON.dot, 'Draft': ICON.pencil }[s];
  return `<span class="status ${cls}">${ic}${esc(s)}</span>`;
};
const typeTag = t => {
  const cls = { 'Finding': 'ty-finding', 'Risk': 'ty-risk', 'Gap: incomplete material': 'ty-gap', 'Gap: not generated': 'ty-gap', 'Cannot be confirmed': 'ty-unk' }[t] || '';

/* Knowledge: one row per data room document or licensor response, with the release choice. */
function relSelect(d, where) {
  if (d.locked) return `<span class="locked">${ICON.lock}DD team only</span>`;
  const v = state.release[d.id];

function docRow(d, where) {
  const meta = d.locked ? `<span class="qsub">${esc(d.locked)}</span>`
    : d.request ? `<span class="qsub">Answer to ${refBtn(d.request)}</span>` : '';
  return `<li><span><span class="mono">${esc(d.id)}</span>${esc(d.name)}${meta}</span>${relSelect(d, where)}</li>`;

/* Sanitised text: mode 'full' is what the lead sees, mode 'out' is what the expert sees. */
function sanParts(parts, mode) {
  return parts.map(p => {
    if (typeof p === 'string') return esc(p);
    if (p.r) return mode === 'full'
      ? `<span class="will-redact">${esc(p.r)}</span>`
      : `<span class="redact" role="img" aria-label="removed"></span>`;
    return mode === 'full' ? `<span class="will-gen">${esc(p.was)}</span>` : `<span class="gen">${esc(p.g)}</span>`;
  }).join('');
}

/* ============ Sign-off strip: the signature element ============ */
function prepCell(agentId) {
  const body = agentId
    ? `<span class="who">${ICON.pencil}<span>${esc(agentName(agentId))}</span></span>`
    : `<span class="who">Not drafted by agents</span>`;
  return `<div class="cell cell-prep"><span class="caps">Prepared</span>${body}</div>`;
}
function chalCell(ch, compact) {
  const map = {
    none: { cls: '', who: 'Not challenged yet' },
    open: { cls: 'is-open', who: 'Red team: open' },
    cleared: { cls: '', who: 'Red team: cleared' },
    returned: { cls: 'is-returned', who: 'Evidence checker: returned' },
    na: { cls: '', who: 'Not challenged: out of scope' }
  };
  const m = map[ch.state] || map.none;
  const sub = !compact && ch.note ? `<span class="sub">${esc(ch.note)}</span>` : '';
  return `<div class="cell cell-chal ${m.cls}"><span class="caps">Challenged</span><span class="who">${esc(m.who)}</span>${sub}</div>`;
}
/* A role name mid-sentence: "Paediatric regulatory expert" -> "paediatric regulatory expert";
   a leading acronym stays as it is ("CMC regulatory expert"). */
const lcRole = s => { s = String(s || ''); return /^[A-Z]{2,}/.test(s) ? s : s.charAt(0).toLowerCase() + s.slice(1); };
function expCell(ex, compact) {
  const map = {
    none: { cls: '', who: 'Not requested' },
    na: { cls: '', who: 'Not needed' },
    drafted: { cls: 'is-open', who: 'Question awaits your approval' },
    sent: { cls: '', who: 'With the ' + lcRole(ex.reviewer) },
    returned: { cls: 'is-back', who: 'View back from the ' + lcRole(ex.reviewer) }
  };
  const m = map[ex.state] || map.none;
  let sub = '';
  if (!compact && ex.state === 'sent') sub = `Sent ${ex.when} · not read in`;
  if (!compact && ex.state === 'returned') sub = `Back ${ex.back} · advice, not evidence`;
  return `<div class="cell cell-exp ${m.cls}"><span class="caps">Expert review</span><span class="who">${esc(m.who)}</span>${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</div>`;
}
function signedInner(role, initials, when, animate) {
  return `<span class="caps">Approved</span><span class="role">${esc(role)}</span>` +
    `<span class="sig${animate ? ' anim' : ''}" aria-hidden="true">${esc(initials)}</span>` +
    `<span class="when">Signed ${esc(when)}</span>`;
}
/* o: { compact, action, id, block, animate }. A Sign button shows only when action is set and nothing blocks. */
function apprCell(ap, o) {
  o = o || {};
  if (ap.state === 'signed') {
    return `<div class="cell cell-appr is-signed" aria-label="Approved by ${esc(ap.role)}, initials ${esc(ap.initials)}, signed ${esc(ap.when)}">${signedInner(ap.role, ap.initials, ap.when, o.animate)}</div>`;
  }
  if (ap.state === 'rejected') {
    return `<div class="cell cell-appr is-rejected"><span class="caps">Approved</span><span class="who">${ICON.cross}<span>Not for approval</span></span></div>`;
  }
  const btn = o.action && !o.block
    ? `<button type="button" class="btn btn-primary btn-sm" data-action="${esc(o.action)}" data-id="${esc(o.id)}">Sign</button>` : '';
  const why = !o.compact && o.block && o.block !== 'done' ? `<span class="sub">${esc(o.block)}</span>` : '';
  return `<div class="cell cell-appr is-awaiting"><span class="caps">Approved</span><span class="await-row"><span class="await">Awaiting ${esc(ap.role)}</span>${btn}</span>${why}</div>`;
}
/* o: { prepared, challenge, expert?, approval, compact?, action?, id?, block?, animate? }. With expert set, the strip has four cells. */
function strip(o) {
  const four = !!o.expert;
  return `<div class="strip${four ? ' four' : ''}${o.compact ? ' compact' : ''}" role="group" aria-label="Sign-off">` +
    prepCell(o.prepared) + chalCell(o.challenge, o.compact) + (four ? expCell(o.expert, o.compact) : '') +
    apprCell(o.approval, { compact: o.compact, action: o.action, id: o.id, block: o.block, animate: o.animate }) + `</div>`;
}
/* The four-cell strip for a finding, with session state applied. */
function findingStrip(f, compact) {
  return strip({ prepared: f.prepared, challenge: f.challenge, expert: expertOf(f), approval: approvalOf(f),
    compact: compact, action: compact ? null : 'sign-finding', id: f.id, block: signBlock(f), animate: state.justSigned === f.id });
}

/* ================= Registries: each screen fragment fills these ================= */
const SCREENS = {};   // route id -> () => html string
const AFTER = {};     // route id -> () => void, runs after the screen is in the DOM
const ACTIONS = {};   // data-action -> (el, event) => void, for clicks
const CHANGES = {};   // data-action -> (el, event) => void, for change events

/* ================= Shared mutations ================= */
/* Sign a finding as the RA DD lead; moves its activities to Signed off. Returns the activity id, if any. */
function signFinding(fid) {
  const f = findingById(fid);
  if (!f || signBlock(f)) return null;
  const when = nowHHMM();
  state.findSigned[fid] = when;
  let actId = null;
  DATA.activities.filter(a => a.finding === fid).forEach(a => { state.actCol[a.id] = 'signed'; state.actSigned[a.id] = when; actId = a.id; });
  state.justSigned = fid;
  addLog(LEAD, 'person', `signed ${fid}.`);
  return actId;
}
/* Where focus should land after an action on a finding, on the current screen. */
function focusAfter(fid, actId) {
  if (state.route === 'run' && actId) return 'card:' + actId;
  if (state.route === 'findings') return 'id:fid-' + fid;
  return 'title';
}

/* ================= Toast ================= */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ================= Drawer shell ================= */
let lastFocus = null;
function showDrawer(html) {
  const d = $('#drawer');
  if (d.hidden) lastFocus = document.activeElement;
  d.innerHTML = html;
  $('#scrim').hidden = false;
  d.hidden = false;
  d.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  const c = $('[data-action="close-drawer"]', d);
  c && c.focus();
}
function closeDrawer(skipFocus) {
  const d = $('#drawer');
  if (d.hidden) return;
  d.hidden = true;
  $('#scrim').hidden = true;
  document.body.style.overflow = '';
  if (!skipFocus && lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
