<title>Diligence Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: three panes; stage rail, live stage, evidence and chat. Dark-first glass on deep navy, teal accent */
:root{
  --bg:#06202b; --bg2:#0a2c3a; --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --line:rgba(169,207,213,.16);
  --fg:#e8f2f4; --muted:#9fb9bf; --accent:#56a3ae; --accent2:#65b8c1; --navy:#024157;
  --go:#4fbf8b; --warn:#e0a24f; --info:#5aa7e0; --stop:#e06a5f; --flag:#cb773d;
  --agent:#65b8c1; --human:#f0c27a;
  --display:"Figtree",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef4f5; --bg2:#e2edef; --glass:rgba(255,255,255,.75); --glass2:rgba(255,255,255,.95); --line:rgba(2,65,87,.14);
  --fg:#10303b; --muted:#4f6b73; --accent:#238a91; --accent2:#157e97; --navy:#024157;
  --go:#1f8a5b; --warn:#a96a12; --info:#1f6fae; --stop:#b23a2f; --flag:#b25e22; --agent:#157e97; --human:#9a6a12; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef4f5; --bg2:#e2edef; --glass:rgba(255,255,255,.75); --glass2:rgba(255,255,255,.95); --line:rgba(2,65,87,.14);
  --fg:#10303b; --muted:#4f6b73; --accent:#238a91; --accent2:#157e97; --navy:#024157;
  --go:#1f8a5b; --warn:#a96a12; --info:#1f6fae; --stop:#b23a2f; --flag:#b25e22; --agent:#157e97; --human:#9a6a12; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 15% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),radial-gradient(900px 500px at 110% 10%,color-mix(in srgb,var(--navy) 60%,transparent),transparent 60%),var(--bg);
  color:var(--fg);font:15px/1.5 var(--body);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.wrap{padding-inline:16px;padding-block:14px 24px;max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font:800 22px/1.15 var(--display);margin:0;text-wrap:balance}
.brand .q{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font:600 11px/1.6 var(--body);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--glass)}
.pill.fict{color:var(--flag);border-color:color-mix(in srgb,var(--flag) 50%,transparent)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--glass);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--glass2);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04161d}
.btn.primary:hover{background:var(--accent2)}
.toggle[aria-pressed="true"]{border-color:var(--flag);color:var(--flag)}
.grid{display:grid;grid-template-columns:250px minmax(0,1fr) 400px;gap:14px;align-items:start}
@media (max-width:1180px){.grid{grid-template-columns:220px minmax(0,1fr)} .side{grid-column:1 / -1}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
/* rail */
.rail{padding:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
.rail h2,.side h2{font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 6px 10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps button{width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 8px;display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:13.5px;line-height:1.3;color:var(--muted)}
.steps button:hover:not(:disabled){background:var(--glass2)}
.steps button:disabled{cursor:default;opacity:.45}
.steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);border:1px solid var(--line)}
.steps li.done .n{background:color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent);color:var(--fg)}
.steps li.cur button{background:var(--glass2);color:var(--fg)}
.steps li.cur .n{background:var(--accent);border-color:var(--accent);color:#04161d}
.steps .g{display:block;font-size:11.5px;color:var(--warn);margin-top:2px}
.steps .g.made{color:var(--go)}
/* stage */
.stage{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font:600 12px var(--mono);color:var(--accent2);letter-spacing:.04em}
.stage h2{font:800 26px/1.15 var(--display);margin:2px 0 0;text-wrap:balance}
.narr{border-left:0;background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:10px;padding:10px 14px;color:var(--fg);font-size:15px}
.narr b{color:var(--accent2);font-weight:700;margin-right:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.who{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-size:13px;border:1px solid var(--line);background:var(--glass)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.agent i{background:var(--agent)} .chip.human i{background:var(--human)} .chip.tool i{background:var(--muted)}
.runbox{display:flex;flex-direction:column;gap:6px;font:13px/1.5 var(--mono);color:var(--muted);background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.runbox .ok{color:var(--go)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--agent);margin-right:8px;animation:pulse 1s infinite ease-in-out}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.out{animation:none!important}}
.outs{display:flex;flex-direction:column;gap:12px}
.out{border:1px solid var(--line);background:var(--glass2);border-radius:12px;padding:14px 16px;animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(6px);opacity:.2}}
.out .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}
.out h3{font:700 16px/1.3 var(--display);margin:0 0 6px}
.md{font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.md p{margin:.45em 0}.md ul{margin:.35em 0;padding-left:1.2em}.md li{margin:.15em 0}
.md h1{font:800 18px var(--display);margin:.4em 0}.md h2{font:700 16px var(--display);margin:.8em 0 .3em}.md h3{font:700 15px var(--display);margin:.7em 0 .2em}
.md blockquote{margin:.4em 0;padding:4px 10px;border-radius:6px;background:color-mix(in srgb,var(--flag) 12%,transparent);color:var(--muted)}
.md code{font:12.5px var(--mono);background:var(--glass);padding:1px 4px;border-radius:4px}
.tw{overflow-x:auto;margin:.5em 0}
.md table{border-collapse:collapse;font-size:13px;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.md th{background:var(--glass)}
.note{margin-top:10px;border-radius:9px;padding:8px 12px;font-size:13.5px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.note.flag{background:color-mix(in srgb,var(--flag) 18%,transparent);border:1px solid color-mix(in srgb,var(--flag) 45%,transparent)}
.note b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.sec h4{font:700 12px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.risks{display:flex;flex-wrap:wrap;gap:8px}
.risk{border:1px solid var(--line);background:var(--glass);border-radius:9px;padding:6px 10px;font-size:13.5px;text-align:left;display:flex;gap:8px;align-items:baseline;max-width:100%}
.sev{font:600 10.5px var(--mono);padding:1px 6px;border-radius:5px;white-space:nowrap}
.sev.High{background:color-mix(in srgb,var(--stop) 25%,transparent);color:var(--stop)}
.sev.Medium,.sev.Medium-High{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.sev.Low{background:color-mix(in srgb,var(--go) 20%,transparent);color:var(--go)}
.fac{border:1px dashed color-mix(in srgb,var(--flag) 60%,transparent);border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--flag) 7%,transparent)}
.fac h4{color:var(--flag)}
.fac li{margin:.3em 0;font-size:13.5px}
.gate{border-radius:14px;padding:16px 18px;border:1px solid color-mix(in srgb,var(--warn) 55%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--warn) 12%,transparent),transparent)}
.gate .gq{font:800 19px/1.25 var(--display);margin:4px 0 4px;text-wrap:balance}
.gate .dec{font-size:13px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.opt{border:1px solid var(--line);background:var(--glass2);border-radius:11px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .12s,border-color .12s}
.opt:hover{transform:translateY(-1px)}
.opt b{font-size:15px}
.opt span{font-size:12.5px;color:var(--muted);line-height:1.4}
.opt.Proceed b{color:var(--go)}.opt.Pause b{color:var(--warn)}.opt.Seek b{color:var(--info)}.opt.Stop b{color:var(--stop)}
.opt.Proceed:hover{border-color:var(--go)}.opt.Pause:hover{border-color:var(--warn)}.opt.Seek:hover{border-color:var(--info)}.opt.Stop:hover{border-color:var(--stop)}
.opt.chosen{outline:2px solid var(--accent2)}
.opt .rec{font:600 10.5px var(--mono);color:var(--flag)}
.chosenbox{margin-top:12px;border-radius:10px;padding:10px 12px;background:var(--glass2);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.end{text-align:left;display:flex;flex-direction:column;gap:12px}
.end .big{font:800 24px/1.2 var(--display)}
/* side */
.side{display:flex;flex-direction:column;min-height:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 28px)}
@media (max-width:1180px){.side{position:static;max-height:none}}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:transparent;border-radius:7px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--glass2);color:var(--fg)}
.tabbody{padding:12px;overflow:auto;min-height:0;flex:1}
.chatlog{display:flex;flex-direction:column;gap:10px;min-height:120px}
.msg{border-radius:12px;padding:9px 12px;font-size:14px;max-width:100%}
.msg.u{align-self:flex-end;background:color-mix(in srgb,var(--accent) 28%,transparent);max-width:90%}
.msg.a{background:var(--glass2);border:1px solid var(--line)}
.msg.sys{color:var(--muted);font-size:13px;background:transparent;padding:0}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.sug{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:4px 10px;font-size:12.5px;text-align:left}
.ask{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.ask textarea{flex:1;min-width:0;resize:vertical;min-height:44px;max-height:160px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);color:var(--fg);padding:9px 11px;font:14px/1.4 var(--body)}
.doclist{display:flex;flex-direction:column;gap:4px}
.doc{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:baseline;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:8px;font-size:13.5px}
.doc:hover:not(:disabled){background:var(--glass2)}
.doc:disabled{cursor:default}
.doc code{font:12px var(--mono);color:var(--accent2)}
.doc .st{font:600 10.5px var(--mono);color:var(--muted)}
.doc.missing{opacity:.85}.doc.missing .st{color:var(--stop)}
.docview{margin-top:8px}
.rtab{width:100%;border-collapse:collapse;font-size:13px}
.rtab td,.rtab th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.rtab th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rpts svg{width:100%;height:auto;display:block}
.small{font-size:12.5px;color:var(--muted)}
.log li{font-size:13.5px;margin:.35em 0}
.hl{animation:hl 1.6s ease}
.steps li.grp{font:700 10.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.steps li.grp em{font-style:normal;color:var(--accent2);letter-spacing:.04em;text-transform:none;font-weight:600;margin-left:4px}
.steps .g.idle{color:var(--muted)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:10px}
.mod{border:1px solid var(--line);background:var(--glass2);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:5px;transition:transform .12s,border-color .12s}
.mod:hover{transform:translateY(-1px);border-color:var(--accent)}
.mod .mtop{display:flex;justify-content:space-between;align-items:center}
.mod .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);border:1px solid var(--line)}
.mod .mst{font:600 11px var(--mono);color:var(--muted)}
.mod.Proceed{border-color:color-mix(in srgb,var(--go) 60%,transparent)}.mod.Proceed .mst{color:var(--go)}
.mod.Pause{border-color:color-mix(in srgb,var(--warn) 60%,transparent)}.mod.Pause .mst{color:var(--warn)}
.mod.Seek{border-color:color-mix(in srgb,var(--info) 60%,transparent)}.mod.Seek .mst{color:var(--info)}
.mod b{font-size:15px}
.mod .msum{font-size:12.5px;color:var(--muted);line-height:1.4}
.gate.spec{border-color:color-mix(in srgb,var(--info) 50%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--info) 10%,transparent),transparent)}
@keyframes hl{0%{background:color-mix(in srgb,var(--accent) 40%,transparent)}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="pill fict">Fictional test case</span><span class="pill" id="initiative"></span></div>
      <h1 id="title"></h1>
      <div class="q" id="question"></div>
    </div>
    <div class="ctrls">
      <button class="btn toggle" id="facBtn" aria-pressed="false" title="Show the answer key: planted issues and the recommended call at each gate">Facilitator view</button>
      <button class="btn" id="resetBtn">Start over</button>
    </div>
  </header>

  <div class="grid">
    <nav class="panel rail" aria-label="Workflow stages">
      <h2>Workflow</h2>
      <ol class="steps" id="steps"></ol>
    </nav>

    <main class="panel stage" id="stage" aria-live="polite"></main>

    <aside class="panel side">
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-t="chat" aria-selected="true">Ask the data room</button>
        <button role="tab" data-t="docs" aria-selected="false">Data room</button>
        <button role="tab" data-t="risk" aria-selected="false">Risks and rPTS</button>
        <button role="tab" data-t="log" aria-selected="false">Decisions</button>
      </div>
      <div class="tabbody" id="tabbody"></div>
    </aside>
  </div>
</div>

to the safety and PV workstream.", "options": [{"label": "Proceed", "consequence": "Clinical findings go to risk synthesis with the endpoint and accelerated approval items marked provisional.", "conditions": "Endpoint alignment (R-01) carried as provisional until DR-16 arrives; hepatic case (R-06) carried as referred to safety and PV."}, {"label": "Pause", "consequence": "Clinical work waits and risk synthesis starts without clinical input.", "conditions": "Costs time against bid exclusivity (2026-11-20); no new evidence is expected without a request."}, {"label": "Seek more information", "consequence": "Clinical work continues on available evidence, with the endpoint and pathway findings kept wide until DR-16 and DR-20 are received.", "request": "Request DR-16 (FDA written response to the 2025-03-20 Type C request) and DR-20 (study 101 full CSR and cohort B BICR charter) from the seller via the portfolio DD team."}], "recommended": "Seek more information", "evidenceThatWouldChangeIt": "DR-16 showing FDA accepted PFS as primary would move this to Proceed; DR-16 showing FDA rejected PFS would raise the endpoint risk toward Pause.", "feedsRisks": ["R-01", "R-02", "R-06", "R-11"]}}, {"id": "dd-cmc", "title": "Specialist deep dive: CMC regulatory", "narration": "The CMC agent assesses readiness against the next milestone (NDA H1 2027) and treats missing evidence as risk. Every CMC red flag goes to the specialist.", "agents": ["CMC regulatory agent"], "agentIds": ["a_cmc"], "tools": [], "humanReviewer": "CMC regulatory specialist", "outputs": [{"agent": "CMC regulatory agent", "agentId": "a_cmc", "heading": "CMC readiness against NDA H1 2027", "body": "| Area | Finding | Source | Flag |\n|---|---|---|---|\n| Sole DS site inspection | Form 483, five observations: HPLC audit trail not reviewed pre-release; OOS investigation closed without root cause; shared analyst logins; cleaning validation gap; change control for a route B raw material supplier | DR-09 S1 | RED |\n| Com isting the EU timeline without checking the PIP requirement."}, {"id": "PI-06", "title": "Agent overstatement: clinical documentation agent first draft says FDA agreed accelerated approval", "severity": "High", "plantedIn": [{"file": "01 Decision Workflow Spec.md", "section": "Stage dd-clinical, first agent output (draft v1)"}, {"file": "DR-06 Agency Meeting Minutes Excerpts.md", "section": "Excerpt A, Question 3 (actual FDA language)"}], "surfacesAt": ["dd-clinical", "challenge-pass"], "caughtBy": {"agent": "a_risk (challenge pass)", "human": "crd"}, "rightResponse": "The specialist corrects 'FDA agreed' to 'FDA declined to agree in advance'. The challenge pass independently flags the unsupported claim. The correction is logged and D6 is reduced. This is the demonstration of 'no citation, no claim' and the human check.", "wrongResponse": "Passing the agent text through to the risk agent."}, {"id": "PI-07", "title": "Conflicting data versions: ORR 46% vs 40%, DoR 9.8 vs 8.4 months, IB v5.0 vs v6.0", "severity": "Medium", "plantedIn": [{"file": "DR-02 Investor Deck Summary.md", "section": "Slide 6"}, {"file": "DR-04 Clinical Development Summary.md", "section": "Phase 2 cohort B efficacy: data versions; Investigator's Brochure"}, {"file": "DR-15 Interim Topline Table.csv", "section": "Rows 1 to 5"}], "surfacesAt": ["asset-profile", "dd-clinical"], "caughtBy": {"agent": "a_crd", "human": "crd"}, "rightResponse": "Separate what the data show (BICR-confirmed, later cutoff) from what the sponsor claims. Use the later BICR version in all analysis, note the deck figure as non-authoritative, and document IB version alignment as a request.", "wrongResponse": "Quoting 46% as the response rate."}, {"id": "PI-08", "title": "Draft labeling claims without support", "severity": "Medium", "plantedIn": [{"file": "DR-10 Draft Labeling and TPP Claims.md", "section": "Claims L1, L2, L3, L4, L6"}], "surfacesAt": ["dd-labeling"], "caughtBy": {"agent": "a_lab", "human": "lab"}, "rightResponse": "Claim-to-evidence map shows L2 (OS) has no data, L3 uses the deck DoR, L4 conflicts with the IND safety report, L6 conflicts with the study monitoring plan, L1 extends beyond the enrolled tumor type. Agent does not rewrite label text; specialist judges claim strength.", "wrongResponse": "Agent rewriting the claims."}, {"id": "PI-09", "title": "Promotional history: OPDP untitled letter not mentioned in the deck", "severity": "Medium-Low", "plantedIn": [{"file": "DR-05 Regulatory Correspondence Log.csv", "section": "Entry 16"}, {"file": "DR-02 Investor Deck Summary.md", "section": "Slide 3 ('Breakthrough-level activity')"}, {"file": "DR-07 Designations and IND-CTA History.md", "section": "BTD denied"}], "surfacesAt": ["dd-commercial"], "caughtBy": {"agent": "a_cr", "human": "cr"}, "rightResponse": "Commercial agent activates because the asset is near launch. It lists the untitled letter, notes the BTD denial against the deck language, and requests DR-21 for the letter and the company's response.", "wrongResponse": "Skipping the commercial regulatory step because the asset is not marketed."}, {"id": "PI-10", "title": "Hepatic safety: company says no Hy's law cases; IND safety report describes a potential case", "severity": "Medium-High", "plantedIn": [{"file": "DR-12 Safety Summary.md", "section": "Hepatic safety statement vs IND safety report"}, {"file": "DR-02 Investor Deck Summary.md", "section": "Slide 9"}, {"file": "DR-04 Clinical Development Summary.md", "section": "Interim and exploratory notes"}], "surfacesAt": ["dd-clinical", "challenge-pass"], "caughtBy": {"agent": "a_crd; challenge pass if missed", "human": "crd"}, "rightResponse": "Report both statements side by side with citations. Refer clinical safety adjudication to the safety and PV workstream. The regulatory view covers REMS and label implications only.", "wrongResponse": "Resolving the discrepancy by clinical judgment inside the regulatory team."}], "documents": [{"id": "DR-00", "title": "Data Room Index", "path": "data-room/DR-00 Data Room Index.csv", "format": "csv", "content": "doc_id,title,category,status,date,notes\nDR-01,Company Overview,Corporate,Provided,2026-10-05,\nDR-02,Investor Deck Summary (September 2026),Corporate,Provided,2026-09,Company presentation; not a regulatory record\nDR-03,Asset Profile and TPP,Asset,Provided,2026-08,\nDR-04,Clinical Development Summary,Clinical,Provided,2026-09,CSR synopsis only for study 101\nDR-05,Regulatory Correspondence Log,Regulatory,Provided,2026-10,Company-maintained log\nDR-06,Agency Meeting Minutes (excerpts),Regulatory,Provided,2026-10,Excerpts only (A FDA 2024-03, B EMA 2024-09, C FDA 2025-11)\nDR-07,Designations and IND/CTA History,Regulatory,Provided,2026-10,\nDR-08,CMC Summary,CMC,Provided,2026-09,Summary only; no Module 3\nDR-09,Manufacturing Sites and Inspections,CMC,Provided,2026-10,\nDR-10,Draft Labeling and Claims v0.3,Labeling,Provided,2026-08,US draft only\nDR-11,Competitive Landscape,Commercial,Provided,2026-09,\nDR-12,Safety Summary,Safety,Provided,2026-09,High level\nDR-13,Patent and Exclusivity Summary,Legal,Provided,2026-09,High level\nDR-14,Companion Diagnostic Summary,Device,Provided,2026-09,\nDR-15,Interim Topline Table,Clinical,Provided,2026-09,\nDR-16,FDA written response to Type C request (2025-03-20),Regulatory,Not provided,,Referenced in DR-05 entry 13\nDR-17,EMA PIP decision or waiver,Regulatory,Not provided,,No record in data room\nDR-18,CDx analytical and clinical bridging study report (CTA v2 to kit v3),Device,Not provided,,Referenced in DR-14\nDR-19,Drug substance comparability report (route A to B),CMC,Not provided,,Referenced in DR-08 and DR-06 Excerpt A Q6\nDR-20,Study 101 full CSR and cohort B BICR charter,Clinical,Not provided,,Synopsis only\nDR-21,FDA OPDP untitled letter (2026-03-09) and company response,Regulatory,Not provided,,Referenced in DR-05 entry 16\nDR-22,Form 483 and company response (Halvern),CMC,Not provided,,Referenced in DR-05 entries 18 and 19\nDR-23,CDRH Pre-Sub feedback (2024-11-20),Device,Not provided,,Referenced in DR-05 entry 10\n"}, {"id": "DR-01", "title": "Company Overview", "path": "data-room/DR-01 Company Overview.md", "format": "md", "content": "> FICTIONAL - for demonstration. Ostravane Therapeutics is an invented company.\n\n# DR-01 Company Overview: Ostravane Therapeutics, Inc.\n\n| Item | Detail |\n|---|---|\n| Listing | Nasdaq-listed (fictional), headquartered in Cambridge, MA |\n| Founded | 2015 |\n| Employees | 468 (as of 2026-09-30); 41 in Regulatory, Quality and CMC |\n| Market capitalization | about $1.9B (61.0M shares at $31.20, 2026-10-02) |\n| Cash and investments | $412M (2026-06-30); runway into Q3 2027 |\n| Strategic position | Board authorized a strategic review in 2026-06; process led by an outside adviser |\n\n## Pipeline\n\n| Program | Modality | Indication | Stage |\n|---|---|---|---|\n| OST-4417 (lead) | Oral small molecule, TRX-7 cofactor inhibitor | TRX-7-high intrahepatic cholangiocarcinoma, previously treated | Phase III (OST-4417-301) plus Phase 1/2 cohort supporting planned accelerated approval filing |\n| OST-5102 | Oral small molecule, different target | Advanced solid tumors | Phase 1 dose escalation |\n| OST-2230 | Antibody-drug conjugate | Undisclosed solid tumor | IND-enabling |\n\n## Regulatory organization\n\n- VP Regulatory Affairs (US lead); Director, EU Regulatory (based in Dublin); no Japan regulatory lead on staff.\n- CMC is outsourced: drug substance and drug product at contract manufacturers (see DR-08, DR-09).\n- Companion diagnostic developed with Lumenar Diagnostics (see DR-14).\n\n## Deal context\n\nTarnwell Pharma (fictional large-cap acquirer) has signed a mutual NDA and been granted data room access on 2026-10-05. Exclusivity period for bids runs to 2026-11-20.\n"}, {"id": "DR-02", "title": "Investor Deck Summary", "path": "data-room/DR-02 Investor Deck Summary.md", "format": "md", "content": "> FICTIONAL - for demonstration.\n\n# DR-02 Investor Deck Summary (September 2026 corporate presentation, 14 slides, condensed)\n\n## Slide 3: OST-4417 at a glance\n- First-in-class oral TRX-7 cofactor inhibitor for previously treated TRX-7-high intrahepatic cholangiocarcinoma.\n- Orphan Drug (FDA, EU) and Fast Track designations.\n- \"Breakthrough-level activity\" in Phase 2 cohort B.\n\n## Slide 6: Phase 2 cohort B efficacy (data cutoff 2025-09-30)\n| Measure | Value |\n|---|---|\n| Efficacy-evaluable patients | 61 |\n| Objective response rate (ORR) | 46% (28/61) |\n| Median duration of response | 9.8 months |\n| Assessment | Investigator-assessed, includes unconfirmed responses |\n\n## Slide 8: Regulatory alignment\n- \"FDA aligned on PFS as primary endpoint for the Phase III (OST-4417-301)\" (Type B meeting, March 2024).\n- \"Accelerated approval pathway supported by FDA based on cohort B ORR and DoR.\"\n- \"Phase III fully enrolled by year-end 2026; PFS interim analysis in Q2 2027.\"\n\n## Slide 9: Safety\n- \"Well tolerated; no Hy's law cases.\"\n- Grade 3 or higher treatment-related adverse events: 29%.\n\n## Slide 10: Timeline\n| Milestone | Company guidance |\n|---|---|\n| Pre-NDA meeting | Q1 2027 |\n| NDA submission (accelerated approval) | H1 2027 |\n| EU MAA submission | H2 2027 |\n| Japan filing | 2028 |\n| CDx PMA | \"On track with partner\" |\n\n## Slide 12: CMC\n- \"Commercial-ready supply chain with two qualified sites; clean inspection history.\"\n"}, {"id": "DR-03", "title": "Asset Profile and TPP", "path": "data-room/DR-03 Asset Profile and TPP.md", "format": "md", "content": "> FICTIONAL - for demonstration.\n\n# DR-03 Asset Profile and Target Product Profile: OST-4417\n\n| Attribute | Detail |\n|---|---|\n| Code name | OST-4417 (nonproprietary name: application pending, not yet assigned) |\n| Mechanism | Oral, selective inhibitor of the TRX-7 transcriptional cofactor; disrupts a lineage-restricted survival program in TRX-7-high tumors |\n| Dose and form | 150 mg tablet, once daily, continuous 28-day cycles |\n| Indication (target) | Adults with locally advanced or metastatic intrahepatic cholangiocarcinoma, TRX-7-high by IHC (H-score 150 or higher), after at least one prior systemic therapy |\n| Biomarker | TRX-7 IHC assay, Lumenar TRX-7 IHC Assay (clinical trial assay, CTA version 2) |\n| Regulatory status | Phase III enrolling; no marketing application filed anywhere |\n| Combination product | None for the drug; the CDx is an in vitro diagnostic (see DR-14) |\n\n## Target product profile (TPP) summary\n\n| Element | Minimum | Target |\n|---|---|---|\n| Efficacy (Phase III) | PFS HR 0.70 or better vs investigator's choice chemotherapy | PFS HR 0.60 and OS trend favorable |\n| Efficacy (Phase 2 cohort B, accelerated approval) | Confirmed ORR 35% or higher, median DoR 6 months or longer | ORR 40% or higher |\n| Safety | Manageable hepatic events with monitoring | No REMS |\n| Label | Biomarker-selected indication; accelerated approval with confirmatory Phase III | Full approval on Phase III PFS and OS |\n| Storage | 24-month shelf life, room temperature | 36 months |\n"}, {"id": "DR-04", "title": "Clinical Development Summary", "path": "data-room/DR-04 Clinical Development Summary.md", "format": "md", "content": "> FICTIONAL - for demonstration.\n\n# DR-04 Clinical Development Summary: OST-4417\n\n## Studies\n\n| Study | Phase | Design | N | Status (2026-10) |\n|---|---|---|---|---|\n| OST-4417-101 | 1/2 | Dose escalation, then biomarker-selected expansion cohorts (A, B) | 142 total; cohort B n=68 | Cohort B data cutoff 2026-03-31; CSR synopsis dated 2026-06-18 |\n| OST-4417-301 | 3 | Randomized, open-label, 1:1 OST-4417 150 mg QD vs investigator's choice chemotherapy; TRX-7-high; previously treated | 420 planned; 388 enrolled as of 2026-09-15 | Enrollment completes about Dec 2026 |\n\n## OST-4417-301 pivotal design\n\n| Element | Detail |\n|---|---|\n| Primary endpoint | Progression-free survival (PFS) by blinded independent central review (BICR), per protocol v4.0 (2025-02-24) |\n| Key secondary | Overall survival (OS), ORR, DoR, safety, patient-reported outcomes |\n| Prior protocol | v3.0 (2024-06-10): OS primary, PFS key secondary |\n| Statistical plan | Event-driven; interim PFS analysis at about 60% of events, projected Q2 2027; final PFS and OS later |\n| Crossover | Not permitted in v4.0 |\n| Biomarker testing | Clinical trial assay (CTA) version 2 at central lab |\n| Regions | US, EU (6 countries), South Korea; no Japan sites |\n\n## Phase 2 cohort B efficacy: data versions\n\nThe company's two data versions differ (see DR-15 for the table).\n\n| Version | Cutoff | Evaluable | ORR | Median DoR | Basis |\n|---|---|---|---|---|---|\n| Investor deck (DR-02) | 2025-09-30 | 61 | 46% (28/61) | 9.8 mo | Investigator-assessed, includes unconfirmed |\n| CSR synopsis (this document) | 2026-03-31 | 68 | 40% (27/68) | 8.4 mo (95% CI 5.6 to 11.2) | BICR-assessed, confirmed responses only |\n\nMedian PFS in cohort B: 5.9 months (95% CI 4.7 to 7.3). Median OS not mature (data cutoff 2026-03-31, 41% of patients with an event).\n\n## Investigator's Brochure\n\nIB version 6.0 (2026-04) is current. Protocol v4.0 and the 2026 DSURs cite IB v5.0 for the reference safety information. Version alignment has not been documented.\n\n## Interim and exploratory notes\n- A pre-specified DILI (drug-induced liver injury) monitoring plan applies in both studies.\n- One patient in cohort B had ALT above 3x ULN with total bilirubin above 2x ULN and no alternative cause identified; reported as a potential Hy's law case in the 2026-04 IND safety report (see DR-12).\n"}, {"id": "DR-05", "title": "Regulatory Correspondence Log", "path": "data-room/DR-05 Regulatory Correspondence Log.csv", "format": "csv", "content": "entry,date,agency,type,direction,subject,summary,document_ref\n1,2022-02-15,FDA,Pre-IND meeting,Meeting,Pre-IND for OST-4417,Written responses; nonclinical package and starting dose agreed,DR-06 not included\n2,2022-06-10,FDA,IND,Submission,IND opened,IND in effect after 30-day review; no clinical hold,DR-07\n3,2023-02-21,FDA,Orphan designation,Grant,Orphan Drug designation for cholangiocarcinoma,Granted,DR-07\n4,2023-05-12,EU CTA,CTA,Submission,CTA under EU CTR for study 101,Approved in 4 countries by 2023-09,DR-07\n5,2023-09-12,FDA,Fast Track,Grant,Fast Track designation,Granted,DR-07\n6,2023-11-08,EMA,Orphan designation,Grant,EU orphan designation (COMP),Positive opinion adopted,DR-07\n7,2024-03-14,FDA,Type B (end-of-Phase 2),Meeting,Pivotal design; accelerated approval; CDx; hepatic monitoring,Minutes received 2024-04-12,DR-06 (excerpt A)\n8,2024-06-10,FDA,Protocol,Submission,Protocol v3.0 for study 301 (OS primary) submitted to IND,Acknowledged,none\n9,2024-09-19,EMA,Scientific Advice,Meeting,Pivotal design; conditional MA; paediatric requirements,Final advice 2024-10-04,DR-06 (excerpt B)\n10,2024-11-20,FDA,CDRH Pre-Sub,Meeting,CDx pre-submission with Lumenar,Written feedback; PMA pathway confirmed,not provided\n11,2025-02-11,FDA,Type C (written response only),Submission,Request for FDA feedback on proposed protocol v4.0 (PFS primary),Question submitted,not provided\n12,2025-02-24,FDA,Protocol,Submission,Protocol v4.0 for study 301 submitted to IND,Acknowledged,none\n13,2025-03-20,FDA,Type C written response,Receipt,FDA written response to the 2025-02-11 request,Received; company summary only: \"feedback received\",see DR-16\n14,2025-08-05,FDA,Breakthrough Therapy designation request,Submission,BTD request based on cohort B,Submitted,DR-07\n15,2025-11-03,FDA,BTD response,Receipt,BTD request denied,\"Preliminary clinical evidence not sufficient to indicate substantial improvement; may resubmit with more mature data\",DR-06 (excerpt C)\n16,2026-03-09,FDA OPDP,Untitled letter,Receipt,Corporate website and investor materials,\"OPDP untitled letter: statements presenting an investigational drug as safe and effective and implying breakthrough status\",not provided\n17,2026-04-22,FDA,IND safety report,Submission,Potential Hy's law case in cohort B,Submitted within reporting timeline,DR-12\n18,2026-06-24,FDA ORA,Form 483,Receipt,Inspection of drug substance site (Halvern),Five observations; see DR-09,DR-09\n19,2026-07-10,FDA ORA,483 response,Submission,Response to Form 483 by Halvern and sponsor,Submitted; FDA classification pending,not provided\n"}, {"id": "DR-06", "title": "Agency Meeting Minutes Excerpts", "path": "data-room/DR-06 Agency Meeting Minutes Excerpts.md", "format": "md", "content": "> FICTIONAL - for demonstration. Excerpts of invented agency minutes.\n\n# DR-06 Agency Meeting Minutes (excerpts)\n\n## Excerpt A: FDA Type B end-of-Phase 2 meeting, 2024-03-14 (minutes issued 2024-04-12)\n\n**Question 1 (pivotal design).** Sponsor proposed a randomized trial of OST-4417 vs investigator's choice chemotherapy in TRX-7-high disease.\n- FDA response: \"FDA recommends overall survival as the primary endpoint. Progression-free survival may be a key secondary endpoint. If the Sponsor intends to propose PFS as the primary endpoint, the Sponsor should submit justification, including data on the expected relationship to OS, and FDA will review the proposal; this should not be interpreted as agreement.\"\n\n**Question 3 (accelerated approval).** Sponsor asked whether ORR and DoR from cohort B of study 101 could support accelerated approval.\n- FDA response: \"The Agency cannot agree in advance that ORR and DoR will support accelerated approval. The review will depend on the magnitude and durability of response in the biomarker-selected population and on available therapy at the time of submission. A randomized confirmatory trial should be underway at the time of submission.\"\n\n**Question 4 (companion diagnostic).**\n- FDA response: \"A contemporaneously approved in vitro companion diagnostic is expected. The Sponsor should engage CDRH through a pre-submission. The assay used to select patients in the trial should be the final assay or bridged to it with adequate clinical evidence.\"\n\n**Question 5 (hepatic safety).**\n- FDA response: \"Provide a DILI monitoring and stopping-rule plan. The Agency will evaluate the need for a REMS or other risk management at the time of review.\"\n\n**Question 6 (CMC).**\n- FDA response: \"Provide a comparability assessment for the change in the drug substance synthetic route (route A to route B) before the pivotal study uses route B material.\"\n\n## Excerpt B: EMA Scientific Advice, 2024-09-19 (final advice 2024-10-04)\n\n- \"The CHMP advises that OS is the preferred primary endpoint. A PFS primary endpoint requires justification and a plan for OS maturity.\"\n- \"A conditional marketing authorization may be considered if the benefit-risk is positive and comprehensive data can be provided later; this is not a commitment.\"\n- \"The Applicant is reminded that a Paediatric Investigation Plan agreement, or a waiver, is required for validation of a marketing authorization application. No PIP application has been submitted as of the date of this meeting.\"\n\n## Excerpt C: FDA response to Breakthrough Therapy designation request, 2025-11-03\n\n- \"The Agency has determined that the preliminary clinical evidence does not indicate that the drug may demonstrate substantial improvement over available therapy on a clinically significant endpoint. The Sponsor may resubmit with additional, more mature data.\"\n"}, {"id": "DR-07", "title": "Designations and IND-CTA History", "path": "data-room/DR-07 Designations and IND-CTA History.md", "format": "md", "content": "> FICTIONAL - for demonstration.\n\n# DR-07 Designations and IND/CTA History\n\n| Item | Agency | Date | Status |\n|---|---|---|---|\n| IND (fictional number 1XXXXX) | FDA | 2022-06-10 | Active; no clinical hold history |\n| Orphan Drug designation | FDA | 2023-02-21 | Granted |\n| Fast Track designation | FDA | 2023-09-12 | Granted |\n| Orphan designation | EMA (COMP) | 2023-11-08 | Granted; maintenance report due 2026-11 |\n| Breakthrough Therapy designation | FDA | Requested 2025-08-05 | Denied 2025-11-03; not resubmitted |\n| CTA (EU CTR), study 101 | 4 EU states | 2023-09 | Approved |\n| CTA (EU CTR), study 301 | 6 EU states | 2024-10 | Approved; substantial modification for protocol v4.0 approved 2025-04 |\n| South Korea CT approval, study 301 | MFDS | 2025-01 | Approved |\n| PRIME | EMA | Not requested | n/a |\n| Paediatric Investigation Plan or waiver | EMA PDCO | Not found | See DR-00 (not provided) |\n| Japan consultation | PMDA | None | No contact on record |\n"}, {"id": "DR-08", "title": "CMC Summary", "path": "data-room/DR-08 CMC Summary.md", "format": "md", "content": "> FICTIONAL - for demonstration.\n\n# DR-08 CMC Summary: OST-4417 (150 mg tablet)\n\n## Drug substance (DS)\n- Small molecule; synthetic route A used through Phase 2, route B (shortened, higher yield) used for study 301 supply from 2024-09.\n- Route change: FDA asked for a comparability assessment before pivotal use (DR-06 Excerpt A, Q6). Company states \"comparability established.\" Comparability report: not provided (see DR-00).\n- Manufacturer: Halvern Fine Synthesis, Cork, Ireland (fictional CDMO). Sole DS site.\n\n## Drug product (DP)\n- Immediate-release film-coated tablet. Manufacturer: Corvane Pharma Services, Durham, NC (fictional CDMO). Packaging: Brightline Packaging, Dayton, OH (fictional).\n- Phase III clinical supply made at 25 kg scale; planned commercial scale 100 kg. Process performance qualification (PPQ) planned Q1 2027, not started.\n\n## Stability\n| Material | Batches | Longest long-term data (25C/60% RH) | Proposed shelf life |\n|---|---|---|---|\n| DS (route B) | 3 | 12 months | Retest 24 months (extrapolation) |\n| DP | 3 registration batches | 18 months | 24 months (extrapolation per ICH Q1E) |\n\n## Specifications\n- Specifications set for Phase III; impurity limits for two route B process impurities are provisional and not yet qualified against nonclinical exposure (genotoxic impurity assessment per ICH M7 summarized only).\n\n## Open items (company-reported)\n1. FDA Form 483 at Halvern (2026-06-24), five observations; response submitted 2026-07-10; classification pending.\n2. Comparability report for route A to B.\n3. Commercial-scale PPQ and registration of a second DS site (none identified).\n\n## Module 3 readiness\nCompany assessment: \"Module 3 on track for H1 2027 submission.\" No draft Module 3 provided; only this summary.\n"}, {"id": "DR-09", "title": "Manufacturing Sites and Inspections", "path": "data-room/DR-09 Manufacturing Sites and Inspections.csv", "format": "csv", "content": "site_id,site,location,role,regulators_inspected_by,last_inspection,outcome,open_items\nS1,Halvern Fine Synthesis,\"Cork, Ireland\",Drug substance (sole site),\"FDA (2024-05, 2026-06); HPRA (2023-11)\",\"2026-06-24 (FDA)\",\"Form 483 with 5 observations; classification pending\",\"Obs 1: HPLC audit trail not reviewed before batch release; Obs 2: OOS investigation for impurity result closed without root cause; Obs 3: shared analyst logins on 2 instruments; Obs 4: cleaning validation gap; Obs 5: change control for route B raw material supplier. Response submitted 2026-07-10; no FDA reply yet.\"\nS2,Corvane Pharma Services,\"Durham, NC, USA\",Drug product manufacture,\"FDA (2025-03)\",\"2025-03-18 (FDA)\",\"No Action Indicated (NAI)\",\"None open\"\nS3,Brightline Packaging,\"Dayton, OH, USA\",Packaging and labeling,\"None by FDA in 5 years\",\"Customer audit 2025-08\",\"Customer audit: 2 minor findings, closed\",\"None open\"\nS4,Lumenar Diagnostics Reference Lab,\"Boulder, CO, USA\",Central CDx testing (clinical trial assay),\"CLIA/CAP\",\"2026-02 (CAP)\",\"Accredited\",\"Final CDx kit manufacturing site not yet named\"\n"}, {"id": "DR-10", "title": "Draft Labeling and TPP Claims", "path": "data-room/DR-10 Draft Labeling and TPP Claims.md", "format": "md", "content": "> FICTIONAL - for demonstration.\n\n# DR-10 Draft Labeling and Claims (company working draft v0.3, 2026-08)\n\n## Draft indication\n\"OST-4417 is indicated for the treatment of adult patients with locally advanced or metastatic cholangiocarcinoma whose tumors express TRX-7, as detected by an FDA-approved test, who have received prior systemic therapy.\"\n\n## Draft claims\n\n| # | Claim | Stated support |\n|---|---|---|\n| L1 | \"Indicated for cholangiocarcinoma\" (intrahepatic and extrahepatic) | Study 101 cohort B (intrahepatic only enrolled) |\n| L2 | \"Improves overall survival\" | Study 301; OS data do not exist yet; cohort B OS immature |\n| L3 | \"Durable responses (median DoR 9.8 months)\" | Deck version (DR-02); BICR-confirmed value is 8.4 months (DR-04) |\n| L4 | \"No Hy's law cases observed\" | Safety summary (DR-12) |\n| L5 | \"First-in-class\" | Company statement; not a label element |\n| L6 | \"Once-daily oral, no routine hepatic monitoring required\" | Study 101 monitoring plan required liver tests every 2 weeks for 12 weeks |\n| L7 | Accelerated approval statement and confirmatory trial description | Study 301 (OS key secondary) |\n\n## Version note\nThis draft has no EU SmPC or Japan package insert counterpart. Only a US-style draft was provided.\n"}, {"id": "DR-11", "title": "Competitive Landscape", "path": "data-room/DR-11 Competitive Landscape.csv", "format": "csv", "content": "competitor,sponsor,mechanism,stage,biomarker_selected,regulatory_status,key_regulatory_note\nNVB-210,Norvane Bio (fictional),Oral inhibitor of a different pathway,Phase III,Yes (different marker),Fast Track; ORR-based accelerated filing planned 2027,Could become available therapy before OST-4417 reviews\nCLD-88,Caldera Oncology (fictional),Antibody targeting a surface antigen,Phase II,No,Orphan,Randomized Phase III not started\nMRT-302,Meridian Therapeutics (fictional),Oral inhibitor of TRX-7 upstream pathway,Phase II,Yes (TRX-7 related),Orphan,Same biomarker; may share CDx considerations\nStandard chemotherapy regimens,Generic,Cytotoxic combination,Marketed,No,Approved,Comparator in study 301\nApproved targeted agents,Various (fictional class),Targeted therapy for other molecular subsets,Marketed,Yes (other biomarkers),Approved,Different biomarker populations; limited overlap with TRX-7-high\nOST-4417,Ostravane,TRX-7 cofactor inhibitor,Phase III,Yes (TRX-7 IHC),Orphan (US, EU); Fast Track; BTD denied,Accelerated approval request depends on available therapy at filing\n"}, {"id": "DR-12", "title": "Safety Summary", "path": "data-room/DR-12 Safety Summary.md", "format": "md", "content": "> FICTIONAL - for demonstration. High-level only.\n\n# DR-12 Safety Summary: OST-4417 (study 101, N=142, cutoff 2026-03-31)\n\n| Measure | Value |\n|---|---|\n| Treatment-related AE, grade 3 or higher | 29% |\n| ALT or AST elevation, any grade | 38% |\n| ALT or AST elevation, grade 3 | 7% |\n| Dose reductions for hepatic events | 11% |\n| Discontinuation for treatment-related AE | 8% |\n| Treatment-related deaths | 0 |\n\n## Hepatic safety statement (company)\n\"No cases meeting Hy's law criteria have been observed.\"\n\n## IND safety report (2026-04-22)\nThe Phase 1/2 data listing shows one patient (cohort B) with ALT above 3x ULN, total bilirubin above 2x ULN, no cholestasis, and no alternative cause identified at the time of reporting; the event resolved after treatment interruption. The report classifies it as a \"potential Hy's law case.\"\n\n## Risk management\nFDA stated it will evaluate the need for a REMS at review (DR-06 Excerpt A, Q5). No REMS proposal has been drafted.\n"}, {"id": "DR-13", "title": "Patent and Exclusivity Summary", "path": "data-room/DR-13 Patent and Exclusivity Summary.md", "format": "md", "content": "> FICTIONAL - for demonstration. High-level only; legal workstream owns freedom-to-operate.\n\n# DR-13 Patent and Exclusivity Summary\n\n| Item | Detail |\n|---|---|\n| Composition of matter | Granted US, EP, JP; expiry 2037 before extension |\n| Method of use (TRX-7-high) | Granted US; EP pending; expiry 2041 |\n| Polymorph a const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function inline(s){
  return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
}
function md(src){
  const L = String(src||"").replace(/\r/g,"").split("\n"); let h = "", i = 0;
  while(i < L.length){
    const l = L[i];
    if(!l.trim()){ i++; continue; }
    if(/^\|/.test(l.trim())){
      const rows=[]; while(i<L.length && /^\|/.test(L[i].trim())){ rows.push(L[i].trim()); i++; }
      const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const body = rows.filter(r => !/^\|[\s:|-]+\|$/.test(r));
      h += '<div class="tw"><table><thead><tr>' + cells(body[0]).map(c=>"<th>"+inline(c)+"</th>").join("") + "</tr></thead><tbody>" +
        body.slice(1).map(r=>"<tr>"+cells(r).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("") + "</tbody></table></div>";
      continue;
    }
    let m;
    if((m = l.match(/^(#{1,4})\s+(.*)/))){ const n=Math.min(m[1].length,3); h += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if(/^\s*>/.test(l)){ let q=[]; while(i<L.length && /^\s*>/.test(L[i])){ q.push(L[i].replace(/^\s*>\s?/,"")); i++; } h += "<blockquote>"+inline(q.join(" "))+"</blockquote>"; continue; }
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){ let it=[]; while(i<L.length && /^\s*([-*]|\d+\.)\s+/.test(L[i])){ it.push(L[i].replace(/^\s*([-*]|\d+\.)\s+/,"")); i++; } h += "<ul>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>"; continue; }
    let p=[]; while(i<L.length && L[i].trim() && !/^(#{1,4}\s|\s*>|\s*([-*]|\d+\.)\s|\|)/.test(L[i])){ p.push(L[i]); i++; }
    h += "<p>"+inline(p.join(" "))+"</p>";
  }
  return h;
}

const stages = D.stages, byId = Object.fromEntries(stages.map((s,i)=>[s.id,{...s,idx:i}]));
const risksById = Object.fromEntries(D.risks.map(r=>[r.id,r]));
const piById = Object.fromEntries(D.plannedIssues.map(p=>[p.id,p]));
const humanLabel = id => (D.team.humans.find(h=>h.id===id)||{}).label || id;
const TERM = D.meta.terminalStates;

let S = fresh();
function fresh(){ return { cur: stages[0].id, reached: new Set([stages[0].id]), ran: new Set(), decisions: {}, spec: {}, end: null, fac: false }; }
const LS = "dd-walkthrough-v2";
function save(){ try{ localStorage.setItem(LS, JSON.stringify({...S, reached:[...S.reached], ran:[...S.ran]})); }catch(e){} }
try{ const v = JSON.parse(localStorage.getItem(LS)||"null"); if(v && (byId[v.cur] || v.cur === "HUB")) S = {spec:{}, ...v, reached:new Set(v.reached), ran:new Set(v.ran)}; }catch(e){}

$("#initiative").textContent = D.meta.initiative;
$("#title").textContent = D.company.name.replace(/\s*\(fictional\)/i,"") + " · " + D.asset.code;
$("#question").textContent = D.meta.acquirerQuestion;

function optClass(label){ return /^Proceed|Continue/i.test(label) ? "Proceed" : /^Pause/i.test(label) ? "Pause" : /^Seek|Request|more information/i.test(label) ? "Seek" : /^Stop|Walk/i.test(label) ? "Stop" : "Seek"; }

const isMod = s => s.id.startsWith("dd-");
const firstMod = stages.findIndex(isMod), lastMod = stages.map(isMod).lastIndexOf(true);
const SCOPE = stages.slice(0, firstMod), MODS = stages.filter(isMod), SYNTH = stages.slice(lastMod + 1);
const HUBGATE = (D.gates || []).find(g => g.hubGate) || (stages.find(s => s.gate && s.gate.hubGate) || {}).gate;
const hubOpen = () => MODS.some(m => S.reached.has(m.id));
const shortTitle = s => s.title.replace(/^Specialist deep dive:\s*/i, "");
const letter = s => String.fromCharCode(65 + MODS.findIndex(m => m.id === s.id));
function specChip(s){
  const d = S.spec[s.id];
  if(d) return `<span class="g made">${esc(d.label)}</span>`;
  return `<span class="g ${S.ran.has(s.id) ? "" : "idle"}">${S.ran.has(s.id) ? "call needed" : "not started"}</span>`;
}
function li(s, n, extra){
  const cls = [S.cur===s.id && !S.end ? "cur" : "", S.ran.has(s.id) ? "done" : ""].join(" ");
  return `<li class="${cls}"><button data-s="${s.id}" ${S.reached.has(s.id)?"":"disabled"}><span class="n">${n}</span><span>${esc(isMod(s) ? (s.specialtyGate?.specialty || shortTitle(s)) : s.title)}${extra}</span></button></li>`;
}
function gchip(s){ return s.gate && !s.gate.hubGate ? `<span class="g ${S.decisions[s.gate.id]?"made":""}">${esc(s.gate.id)} ${S.decisions[s.gate.id] ? "· "+esc(S.decisions[s.gate.id].label) : "· decision"}</span>` : ""; }
function renderSteps(){
  const decided = MODS.filter(m => S.spec[m.id]).length;
  const hg = HUBGATE && S.decisions[HUBGATE.id] ? " · " + esc(HUBGATE.id) + " " + esc(S.decisions[HUBGATE.id].label) : "";
  $("#steps").innerHTML =
    `<li class="grp">Scoping</li>` + SCOPE.map((s,i) => li(s, i+1, gchip(s))).join("") +
    `<li class="grp">Specialty reviews <em>any order</em></li>` +
    `<li class="${S.cur==="HUB" && !S.end ? "cur" : ""}"><button data-s="HUB" ${hubOpen()?"":"disabled"}><span class="n">&#9670;</span><span>Specialty hub<span class="g ${decided===MODS.length?"made":""}">${decided} of ${MODS.length} called${hg}</span></span></button></li>` +
    MODS.map(s => li(s, letter(s), specChip(s))).join("") +
    `<li class="grp">Synthesis</li>` + SYNTH.map((s,i) => li(s, SCOPE.length+i+1, gchip(s))).join("");
}
$("#steps").addEventListener("click", e => { const b = e.target.closest("button[data-s]"); if(!b) return; S.cur = b.dataset.s; S.end = null; save(); render(); });

function outputsHTML(s){
  return s.outputs.map(o => `<article class="out">
    <div class="meta"><span class="chip agent"><i></i>${esc(o.agent)}</span></div>
    <h3>${esc(o.heading)}</h3><div class="md">${md(o.body)}</div>
    ${o.reviewerNote ? `<div class="note ${/^FLAG/i.test(o.reviewerNote)?"flag":""}"><b>${/^FLAG/i.test(o.reviewerNote)?"Human review":"Reviewed"}</b>${inline(o.reviewerNote)}</div>` : ""}
  </article>`).join("");
}

const target = id => (id && id.startsWith("dd-")) ? "HUB" : id;
const titleOf = id => id === "HUB" ? "the specialty hub" : (byId[id]?.title || "next stage");
function gateHTML(s, gg){
  const g = gg || s.gate, made = S.decisions[g.id];
  return `<section class="gate">
    <div class="eyebrow">Decision gate ${esc(g.id)}</div>
    <div class="gq">${esc(g.question)}</div>
    <div class="dec">Decides: <strong>${esc(g.decider)}</strong></div>
    <div class="opts">${g.options.map((o,k)=>`<button class="opt ${optClass(o.label)} ${made&&made.k===k?"chosen":""}" data-k="${k}">
      <b>${esc(o.label)}</b><span>${esc(o.consequence)}</span>${S.fac && o.label===g.recommended ? '<span class="rec">Recommended call</span>' : ""}</button>`).join("")}</div>
    ${S.fac ? `<div class="note flag" style="margin-top:12px"><b>Facilitator</b>Recommended: ${esc(g.recommended)}. What would change the call: ${esc(g.evidenceThatWouldChangeIt)}</div>` : ""}
    ${made ? `<div class="chosenbox"><span>Decision recorded: <strong>${esc(made.label)}</strong></span><button class="btn primary" id="goNext">${made.next.startsWith("END_") ? "See outcome" : "Continue to " + esc(titleOf(target(made.next)))}</button></div>` : ""}
  </section>`;
}

function specGateHTML(s){
  const g = s.specialtyGate; if(!g) return "";
  const made = S.spec[s.id];
  return `<section class="gate spec">
    <div class="eyebrow">Specialty call ${esc(g.id || "")}: ${esc(g.specialty || shortTitle(s))}</div>
    <div class="gq">${esc(g.question)}</div>
    ${g.statusSummary ? `<div class="md" style="margin:4px 0 6px">${md(g.statusSummary)}</div>` : ""}
    <div class="dec">Decides: <strong>${esc(g.decider)}</strong></div>
    <div class="opts">${g.options.map((o,k)=>`<button class="opt sopt ${optClass(o.label)} ${made&&made.k===k?"chosen":""}" data-k="${k}">
      <b>${esc(o.label)}</b><span>${esc(o.consequence)}</span>${o.request ? `<span><em>Request:</em> ${esc(o.request)}</span>` : ""}${o.conditions ? `<span><em>Carried forward:</em> ${esc(o.conditions)}</span>` : ""}${S.fac && o.label===g.recommended ? '<span class="rec">Recommended call</span>' : ""}</button>`).join("")}</div>
    ${S.fac ? `<div class="note flag" style="margin-top:12px"><b>Facilitator</b>Recommended: ${esc(g.recommended)}. What would change the call: ${esc(g.evidenceThatWouldChangeIt || "")}</div>` : ""}
    ${made ? `<div class="chosenbox"><span>Call recorded: <strong>${esc(made.label)}</strong></span><button class="btn primary" id="toHub">Back to the specialty hub</button></div>` : ""}
  </section>`;
}
function hubHTML(){
  const decided = MODS.filter(m => S.spec[m.id]).length;
  const cards = MODS.map(m => { const d = S.spec[m.id], g = m.specialtyGate || {};
    return `<button class="mod ${d ? optClass(d.label) : ""}" data-s="${m.id}">
      <span class="mtop"><span class="n">${letter(m)}</span><span class="mst">${d ? esc(d.label) : (S.ran.has(m.id) ? "Call needed" : "Not started")}</span></span>
      <b>${esc(g.specialty || shortTitle(m))}</b>
      <span class="small">${esc(g.decider || m.humanReviewer)}</span>
      ${S.ran.has(m.id) && g.statusSummary ? `<span class="msum">${esc(g.statusSummary)}</span>` : ""}
    </button>`; }).join("");
  return `<div><div class="eyebrow">After scoping</div><h2>Specialty hub</h2></div>
    <div class="narr"><b>What's happening</b>Scoping is done. Each regulatory specialty now runs on its own clock. Open them in any order, review what the agent found, and make a call for that specialty: proceed, pause, or seek more information.</div>
    <div class="mods">${cards}</div>
    ${HUBGATE ? `<div class="small">${decided} of ${MODS.length} specialties have a call. Open specialties can still move to synthesis; they are carried as provisional.</div>` + gateHTML({id:"HUB"}, HUBGATE) : ""}`;
}
function render(){
  renderSteps();
  const el = $("#stage");
  if(S.end){
    const decs = [...Object.values(S.decisions), ...Object.values(S.spec || {})];
    el.innerHTML = `<div class="end"><div class="eyebrow">Outcome</div><div class="big">${esc(TERM[S.end] || S.end)}</div>
      <div class="sec"><h4>Decisions on the record</h4><ul class="log">${decs.map(d=>`<li><strong>${esc(d.gate)}</strong> ${esc(d.question)}: <strong>${esc(d.label)}</strong> <span class="small">(${esc(d.decider)})</span></li>`).join("")}</ul></div>
      <div class="navrow"><button class="btn" id="backGate">Back to the last gate</button><button class="btn" id="askNow">Ask the data room about this outcome</button></div></div>`;
    $("#backGate").onclick = () => { S.end = null; save(); render(); };
    $("#askNow").onclick = () => { selectTab("chat"); const t=$("#q"); if(t){ t.value = "Summarize the regulatory case for and against continuing to valuation, with the conditions you would attach."; t.focus(); } };
    return;
  }
  if(S.cur === "HUB"){
    el.innerHTML = hubHTML();
    el.querySelectorAll(".mod").forEach(b => b.onclick = () => go(b.dataset.s));
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => decide({id:"HUB"}, +b.dataset.k, HUBGATE));
    const gn = $("#goNext"); if(gn) gn.onclick = () => { const d = S.decisions[HUBGATE.id]; d.next.startsWith("END_") ? (S.end = d.next, save(), render()) : go(target(d.next)); };
    return;
  }
  const s = byId[S.cur], ran = S.ran.has(s.id);
  const tools = (s.tools||[]).map(t=>`<span class="chip tool"><i></i>${esc(t)}</span>`).join("");
  el.innerHTML = `
    <div><div class="eyebrow">${isMod(s) ? "Specialty review " + letter(s) + " · any order" : (s.idx < firstMod ? "Scoping" : "Synthesis")}</div><h2>${esc(s.title)}</h2></div>
    <div class="narr"><b>What's happening</b>${esc(s.narration)}</div>
    <div class="who">${s.agents.map(a=>`<span class="chip agent"><i></i>${esc(a)}</span>`).join("")}${tools}<span class="chip human"><i></i>Reviewed by ${esc(s.humanReviewer)}</span></div>
    <div id="runArea">${ran ? "" : `<button class="btn primary" id="runBtn">Run the agents</button>`}</div>
    <div class="outs" id="outs">${ran ? outputsHTML(s) : ""}</div>
    ${ran && s.risksRaised?.length ? `<div class="sec"><h4>Risks raised</h4><div class="risks">${s.risksRaised.map(id=>{const r=risksById[id]||{id,title:id,severity:""};return `<button class="risk" data-r="${esc(id)}"><span class="sev ${esc(r.severity)}">${esc(r.severity||"")}</span><span><code>${esc(id)}</code> ${esc(r.title)}</span></button>`}).join("")}</div></div>` : ""}
    ${ran && S.fac && s.challengesSurfaced?.length ? `<div class="fac sec"><h4>Answer key: planted issues surfacing here</h4><ul>${s.challengesSurfaced.map(id=>{const p=piById[id]||{title:id};return `<li><strong>${esc(id)}</strong> ${esc(p.title)}<br><span class="small">Right response: ${esc(p.rightResponse||"")}</span></li>`}).join("")}</ul></div>` : ""}
    ${ran && isMod(s) ? specGateHTML(s) : ""}
    ${ran && isMod(s) && (!s.specialtyGate || !S.spec[s.id]) ? `<div class="navrow"><span></span><button class="btn" id="toHub2">Back to the specialty hub</button></div>` : ""}
    ${ran && !isMod(s) && s.gate && !s.gate.hubGate ? gateHTML(s) : ""}
    ${ran && !isMod(s) && !s.gate && s.idx < stages.length-1 ? `<div class="navrow"><span></span><button class="btn primary" id="nextBtn">Next: ${esc(titleOf(target(stages[s.idx+1].id)))}</button></div>` : ""}`;
  const rb = $("#runBtn"); if(rb) rb.onclick = () => run(s);
  const nb = $("#nextBtn"); if(nb) nb.onclick = () => go(target(stages[s.idx+1].id));
  ["#toHub", "#toHub2"].forEach(x => { const th = $(x); if(th) th.onclick = () => go("HUB"); });
  el.querySelectorAll(".opt:not(.sopt)").forEach(b => b.onclick = () => decide(s, +b.dataset.k));
  el.querySelectorAll(".sopt").forEach(b => b.onclick = () => decideSpec(s, +b.dataset.k));
  const gn = $("#goNext"); if(gn) gn.onclick = () => { const d = S.decisions[s.gate.id]; d.next.startsWith("END_") ? (S.end = d.next, save(), render()) : go(target(d.next)); };
  el.querySelectorAll(".risk").forEach(b => b.onclick = () => { selectTab("risk"); const row = document.getElementById("risk-"+b.dataset.r); if(row){ row.scrollIntoView({block:"center"}); row.classList.remove("hl"); void row.offsetWidth; row.classList.add("hl"); } });
}

function go(id){ S.cur = id; if(id === "HUB") MODS.forEach(m => S.reached.add(m.id)); else S.reached.add(id); S.end = null; save(); render(); $("#stage").scrollIntoView({block:"start"}); }

function run(s){
  const area = $("#runArea");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lines = [];
  s.agents.forEach(a => { lines.push(a + ": reading the data room"); });
  lines.push("Checking every claim against its source document");
  lines.push("Sending the draft to " + s.humanReviewer + " for review");
  area.innerHTML = `<div class="runbox" id="rb"></div>`;
  const rb = $("#rb"); let k = 0;
  const step = () => {
    if(k > 0) rb.lastElementChild.innerHTML = '<span class="ok">✓</span> ' + esc(lines[k-1]);
    if(k < lines.length){ const d = document.createElement("div"); d.innerHTML = '<span class="dot"></span>' + esc(lines[k]); rb.appendChild(d); k++; setTimeout(step, reduce ? 0 : 520); }
    else { S.ran.add(s.id); save(); render(); }
  };
  step();
}

function decide(s, k, gg){
  const g = gg || s.gate, o = g.options[k];
  S.decisions[g.id] = { k, gate: g.id, question: g.question, label: o.label, consequence: o.consequence, decider: g.decider, next: o.nextStageId, stage: s.id };
  const t = target(o.nextStageId);
  if(t === "HUB") MODS.forEach(m => S.reached.add(m.id)); else if(!t.startsWith("END_")) S.reached.add(t);
  save(); render(); renderTab();
}
function decideSpec(s, k){
  const g = s.specialtyGate, o = g.options[k];
  S.spec[s.id] = { k, gate: g.id || s.id, question: g.question, label: o.label, consequence: o.consequence + (o.request ? " Request: " + o.request : ""), decider: g.decider, stage: s.id };
  save(); render(); renderTab();
}

$("#facBtn").onclick = () => { S.fac = !S.fac; $("#facBtn").setAttribute("aria-pressed", S.fac); save(); render(); };
$("#facBtn").setAttribute("aria-pressed", !!S.fac);
const reset = $("#resetBtn");
reset.onclick = () => {
  if(reset.dataset.armed){ S = fresh(); chat = []; save(); render(); renderTab(); reset.textContent = "Start over"; delete reset.dataset.armed; return; }
  reset.dataset.armed = "1"; reset.textContent = "Click again to reset"; setTimeout(()=>{ reset.textContent = "Start over"; delete reset.dataset.armed; }, 3000);
};

/* ---------- side tabs ---------- */
let tab = "chat";
function selectTab(t){ tab = t; document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.t===t)); renderTab(); }
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-t]"); if(b) selectTab(b.dataset.t); });

let chat = [], sample = null, sampleState = "pending", ctl = null, openDoc = null;
const SUGS = ["What did FDA actually say about the primary endpoint?", "Which documents are missing from the data room?", "What is the inspection status of the manufacturing sites?", "Where do the efficacy numbers disagree, and which should we trust?", "Should we continue to valuation? Give the conditions."];

function renderTab(){
  const b = $("#tabbody");
  if(tab === "chat"){
    b.innerHTML = `<div class="chatlog" id="log">${chat.length ? "" : `<div class="msg sys">Ask anything about ${esc(D.company.name.replace(/\s*\(fictional\)/i,""))} and ${esc(D.asset.code)}. Answers come only from this mock data room and cite document IDs.</div>`}
      ${chat.map(m=>`<div class="msg ${m.role==="user"?"u":"a"}">${m.role==="user"?esc(m.content):`<div class="md">${md(m.content)}</div>`}</div>`).join("")}</div>
      <div class="sugs">${SUGS.map(q=>`<button class="sug">${esc(q)}</button>`).join("")}</div>
      <form class="ask" id="askf"><textarea id="q" rows="2" placeholder="Ask the data room"></textarea><button class="btn primary" id="sendBtn" type="submit">Ask</button></form>
      <div class="small" id="chatNote" style="margin-top:6px">${sampleState==="none" ? "Chat answers need the published page opened in Claude. Everything else works here." : ""}</div>`;
    b.querySelectorAll(".sug").forEach(s => s.onclick = () => { $("#q").value = s.textContent; send(); });
    $("#askf").addEventListener("submit", e => { e.preventDefault(); send(); });
    $("#q").addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
    const lg = $("#log"); b.scrollTop = b.scrollHeight;
  } else if(tab === "docs"){
    const docs = Object.fromEntries(D.documents.map(d=>[d.id,d]));
    b.innerHTML = `<div class="small" style="margin:0 4px 8px">${D.dataRoomIndex.filter(x=>!docs[x.doc_id]).length} of ${D.dataRoomIndex.length} indexed documents were not provided.</div>
      <div class="doclist">${D.dataRoomIndex.map(x=>{const has=!!docs[x.doc_id];return `<button class="doc ${has?"":"missing"}" data-d="${esc(x.doc_id)}" ${has?"":"disabled"}><code>${esc(x.doc_id)}</code><span>${esc(x.title)}</span><span class="st">${has?"open":esc(x.status||"missing")}</span></button>`}).join("")}</div>
      <div class="docview" id="docview">${openDoc && docs[openDoc] ? `<div class="out"><div class="meta"><code>${esc(openDoc)}</code><button class="btn" id="closeDoc" style="margin-left:auto;padding:3px 9px">Close</button></div><div class="md">${md(docs[openDoc].format==="csv"||/\.csv$/i.test(docs[openDoc].path||"") ? csvToMd(docs[openDoc].content) : docs[openDoc].content)}</div></div>` : ""}</div>`;
    b.querySelectorAll(".doc[data-d]").forEach(x => x.onclick = () => { openDoc = x.dataset.d; renderTab(); $("#docview").scrollIntoView({block:"start"}); });
    const cd = $("#closeDoc"); if(cd) cd.onclick = () => { openDoc = null; renderTab(); };
  } else if(tab === "risk"){
    const R = D.rPTS;
    b.innerHTML = `<div class="sec rpts"><h4>rPTS position</h4>${rptsSVG(R)}<div class="small">${esc(D.meta.rPTSBaselineNote)} ${esc(R.leadPositionNote||"")}</div></div>
      <div class="sec" style="margin-top:14px"><h4>Drivers (points against baseline)</h4><div class="tw"><table class="rtab"><thead><tr><th>Driver</th><th>Draft</th><th>Challenged</th></tr></thead><tbody>
      ${R.drivers.map(d=>`<tr title="${esc(d.challengeNote||"")}"><td>${esc(d.driver)}</td><td style="font-family:var(--mono);white-space:nowrap">${d.draftLow} to ${d.draftHigh}</td><td style="font-family:var(--mono);white-space:nowrap">${d.challengedLow} to ${d.challengedHigh}</td></tr>`).join("")}</tbody></table></div></div>
      <div class="sec" style="margin-top:14px"><h4>Risk register</h4><div class="tw"><table class="rtab"><thead><tr><th>Risk</th><th>Severity</th><th>Mitigation</th></tr></thead><tbody>
      ${D.risks.map(r=>`<tr id="risk-${esc(r.id)}"><td><code>${esc(r.id)}</code> ${esc(r.title)}<div class="small">${esc(r.domain)} · owner ${esc(humanLabel(r.owner))}</div></td><td><span class="sev ${esc(r.severity)}">${esc(r.severity)}</span></td><td>${esc(r.mitigation)}</td></tr>`).join("")}</tbody></table></div></div>`;
  } else {
    const decs = [...Object.values(S.decisions), ...Object.values(S.spec || {})];
    b.innerHTML = decs.length ? `<ul class="log">${decs.map(d=>`<li><strong>${esc(d.gate)}</strong> ${esc(d.question)}<br><strong>${esc(d.label)}</strong> <span class="small">by ${esc(d.decider)}</span><div class="small">${esc(d.consequence)}</div></li>`).join("")}</ul>` : `<div class="small">No decisions yet. Each gate's call is recorded here with who made it.</div>`;
  }
}
function csvToMd(t){
  const rows = String(t).trim().split(/\r?\n/).filter(r=>!/^>/.test(r) && r.trim());
  const parse = r => { const out=[]; let cur="", q=false; for(const ch of r){ if(ch==='"'){q=!q;continue;} if(ch===","&&!q){out.push(cur);cur="";continue;} cur+=ch; } out.push(cur); return out.map(c=>c.replace(/\|/g,"/").trim()); };
  const P = rows.map(parse); if(!P.length) return t;
  return "| " + P[0].join(" | ") + " |\n|" + P[0].map(()=>"---").join("|") + "|\n" + P.slice(1).map(r=>"| "+r.join(" | ")+" |").join("\n");
}
function rptsSVG(R){
  const W=360, H=150, x = v => 20 + (v/100)*(W-40);
  const rows = [["Draft", R.draftRangePct, "var(--accent2)"], ["After challenge", R.challengedRangePct, "var(--warn)"], ["Lead position", R.leadPositionIllustrativePct, "var(--human)"]];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="rPTS ranges against an ${R.baselinePct}% baseline">`;
  [0,25,50,75,100].forEach(t => s += `<line x1="${x(t)}" x2="${x(t)}" y1="12" y2="${H-24}" stroke="var(--line)" /><text x="${x(t)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${t}%</text>`);
  s += `<line x1="${x(R.baselinePct)}" x2="${x(R.baselinePct)}" y1="8" y2="${H-24}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${x(R.baselinePct)-4}" y="10" font-size="10" text-anchor="end" fill="var(--muted)">baseline ${R.baselinePct}%</text>`;
  rows.forEach(([lab,[lo,hi],c],i) => { const y = 24 + i*34; s += `<text x="20" y="${y}" font-size="11" fill="var(--fg)">${lab}: ${lo}% to ${hi}%</text><rect x="${x(lo)}" y="${y+5}" width="${x(hi)-x(lo)}" height="10" rx="3" fill="${c}"/>`; });
  return s + "</svg>";
}

/* ---------- chat ---------- */
function context(){
  const pub = {...D}; delete pub.plannedIssues; delete pub.documents;
  pub.stages = stages.filter(s=>S.ran.has(s.id)).map(s=>({title:s.title, outputs:s.outputs.map(o=>({agent:o.agent, heading:o.heading, body:o.body, reviewerNote:o.reviewerNote}))}));
  pub.gates = undefined; pub.decisionsSoFar = [...Object.values(S.decisions), ...Object.values(S.spec || {})].map(d=>({gate:d.gate, question:d.question, decision:d.label, by:d.decider}));
  const docs = D.documents.map(d=>`### ${d.id} ${d.title}\n${d.content}`).join("\n\n");
  return "STRUCTURED DATA:\n" + JSON.stringify(pub) + "\n\nDATA ROOM DOCUMENTS:\n" + docs;
}
const RULES = () => `You are the regulatory due-diligence assistant in a live demo. Everything below is a FICTIONAL test case: a mock acquisition target, asset and data room. Answer the presenter's question using ONLY this material. Rules: cite document IDs (for example DR-06) for every factual claim; when sources conflict, say so and show both sides instead of choosing one; when something is not in the data room, say it is missing and name what would answer it; label any inference as an inference; regulatory judgments and the go/no-go belong to the human team, so frame recommendations as input to them. Keep answers short and scannable: a direct answer first, then up to six bullets. Use Markdown bullets and bold sparingly. American English, no em dashes.\n\n` + context();

async function send(){
  const t = $("#q"), q = (t?.value||"").trim(); if(!q) return;
  if(!sample){ $("#chatNote").textContent = sampleState==="pending" ? "Connecting to Claude, try again in a moment." : "Chat answers need the published page opened in Claude. Everything else works here."; return; }
  chat.push({role:"user", content:q}); chat.push({role:"assistant", content:"Thinking..."}); renderTab();
  const bubble = () => $("#log")?.lastElementChild?.querySelector(".md");
  ctl?.abort(); ctl = new AbortController();
  const turns = [{role:"user", content:RULES()}, {role:"assistant", content:"Understood. I will answer only from the mock data room and cite document IDs."}, ...chat.slice(0,-1).slice(-8)];
  if(turns[2] && turns[2].role !== "user") turns.splice(2,1);
  try{
    const r = await sample(turns, { cache:false, signal:ctl.signal, onText: ({text}) => { chat[chat.length-1].content = text; const el = bubble(); if(el) el.innerHTML = md(text); $("#tabbody").scrollTop = 1e9; } });
    chat[chat.length-1].content = r.text + (r.truncated ? "\n\n_(Answer cut short.)_" : "");
  }catch(e){
    const msg = {not_granted:"Claude access was declined for this page, so chat is off for this view.", rate_limited:"Too many questions at once. Wait a moment and ask again.", session_expired:"Sign in to Claude again, then ask.", cancelled:"Stopped.", refused:"Claude declined that question. Try rephrasing it.", prompt_too_large:"The question plus the data room was too large to send."}[e?.code] || "The answer was interrupted. Ask again.";
    chat[chat.length-1].content = (e?.text ? e.text + "\n\n" : "") + "_" + msg + "_";
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code)) sampleState = "none";
  }
  renderTab();
}

render(); renderTab();
(async () => {
  try{ sample = window.claude ? await window.claude.use("sample") : null; }catch(e){ sample = null; }
  sampleState = sample ? "ready" : "none";
  if(tab === "chat"){ const n = $("#chatNote"); if(n) n.textContent = sample ? "" : "Chat answers need the published page opened in Claude. Everything else works here."; }
})();
})();
</script>
